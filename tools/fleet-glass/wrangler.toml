# Cloudflare Worker config for the Fleet Glass mailbox (worker.js). Deployed with `deploy.ps1`,
# using wrangler's own stored OAuth login -- no credential lives in this repo (#1413).
#
# The KV namespace id below is NOT a secret (aer-works/baton#1413's own ruling): it identifies a
# storage bucket, not a bearer credential, and reveals nothing an attacker could act on without also
# having PUSH_TOKEN/READ_SEGMENT (Worker secrets, pushed by deploy.ps1 from a machine-local file that
# is never committed -- see secrets.local.json in .gitignore).
name = "baton-fleet"
main = "worker.js"
compatibility_date = "2026-08-01"

# workers_dev subdomain route: https://baton-fleet.<account-subdomain>.workers.dev
workers_dev = true

[[kv_namespaces]]
binding = "FLEET"
id = "234888beb432403392f1f14c9c23e939"

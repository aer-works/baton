<!--
  Fleet Glass — the operator's primary observability surface (Baton Spike 1;
  provenance in worker.js's header). #1505 (glass v2 core, epic #1502) merged the deliverables
  inbox into this same artifact as a second tab -- ONE artifact URL identity now, never two
  bookmarks/connector prompts for one operator (menu item #45). inbox.html is deleted; this file's
  own name is the artifact's filename identity and does not change.

  This is a Claude.ai ARTIFACT, not a plain static page: it declares the `mcp` capability and
  watches the `fleet_status` / `deliverables_list` / `deliverable_read` tools on a custom MCP
  connector named "baton" (Settings -> Connectors -> Add custom -> the Worker's
  /mcp/<READ_SEGMENT> URL from tools/fleet-glass/secrets.local.json). Data flows fleet machine ->
  pusher.py -> Worker (worker.js) -> KV -> this page, on a 30s poll, with the viewer's own
  connector credentials. Read-only: no write verbs execute anywhere in this file -- the two
  clipboard buttons per room COPY a CLI verb string for the operator to paste into their own
  Claude Code mobile session; nothing here calls baton or the engine directly (spec/baton.md §10:
  origination and arrest both stay orchestrator-only from this page).

  role/adapter/model/effort/timeoutMs (engine PR #1504, epic #1502 item #5/#6/#7) are read
  ABSENT-SAFE throughout: every reference below is behind a truthiness/null check, so this page
  renders identically whether or not #1504 has merged -- before merge those five fields are simply
  never present on any room object, same as any other optional fleet_status field.

  Timeline entries (menu item #1/#2) are content-free by construction (pusher.py's
  `extract_timeline`, event type + timestamp only, no stdout) and only exist for rooms pusher.py
  judged NON-TERMINAL at push time -- a terminal room's lane will not show a Timeline section here.
-->

<main>
  <div class="masthead">
    <svg class="batonmark" width="27" height="27" viewBox="0 0 26 26" fill="none" aria-hidden="true">

    </svg>
    <div class="titleblock">
      <h1>Fleet Glass <span class="fresh" id="fresh">connecting…</span></h1>
      <p class="kicker">the conductor's view</p>
    </div>
  </div>
  <div class="downbeat" aria-hidden="true"></div>
  <div class="tabs">
    <button class="tabbtn" id="tab-btn-fleet" data-tab="fleet">Fleet</button>
    <button class="tabbtn" id="tab-btn-inbox" data-tab="inbox">Deliverables</button>
  </div>
  <div id="banner"></div>

    <div class="stalenote" id="stalenote"></div>
    <div id="content"></div>

</main>
<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function age(iso){
  if(!iso) return null;
  const ms = Date.now() - Date.parse(iso);
  if(!isFinite(ms) || ms < 0) return null;
  const m = Math.floor(ms/60000);
  if(m < 1) return "just now";
  if(m < 60) return m + "m";
  const h = Math.floor(m/60);
  if(h < 48) return h + "h";
  return Math.floor(h/24) + "d";
}
function dur(msVal){
  if(msVal == null) return null;
  const m = Math.round(msVal/60000);
  return m < 1 ? Math.round(msVal/1000) + "s" : m + "m";
}
function tokens(u){
  if(!u || u.tokensIn == null) return null;
  const t = (u.tokensIn + (u.tokensOut||0))/1000;
  return Math.round(t) + "k tok";
}
function newestStepTime(room){
  let newest = null;
  for(const s of room.steps || []){
    if(s.timestamp && (!newest || s.timestamp > newest)) newest = s.timestamp;
  }
  return newest;
}

// -----------------------------------------------------------------------------------------------
// #1505 item 1: binding fields (role/adapter/model/effort, engine PR #1504) + client-derived
// timebox remaining (timeoutMs - (now - the Running step's own timestamp), both absent-safe).
// -----------------------------------------------------------------------------------------------
function bindingLineHtml(room){
  const bits = [];
  if(room.role) bits.push(esc(room.role));
  if(room.adapter) bits.push(esc(room.adapter));
  if(room.model) bits.push(esc(room.model));
  if(room.effort) bits.push(esc(room.effort));
  return bits.length ? `<div class="ev mono">${bits.join(" · ")}</div>` : "";
}
function timeboxChip(room, running){
  if(!running || room.timeoutMs == null || !running.timestamp) return null;
  const elapsedMs = Date.now() - Date.parse(running.timestamp);
  if(!isFinite(elapsedMs)) return null;
  const remainingMs = room.timeoutMs - elapsedMs;
  const mins = Math.round(Math.abs(remainingMs)/60000);
  return remainingMs >= 0 ? [`⏳ ${mins}m left`, "c-idle"] : [`overdue ${mins}m`, "c-bad"];
}

// -----------------------------------------------------------------------------------------------
// #1505 item 2: honest failure rendering. `try` is corrected-invocation text (a pre-ledger
// refusal's suggested command, spec/baton.md §3), NOT a retry-attempt counter -- the epic
// brainstorm's "try counter" framing does not match what FleetStatusTool actually emits, and this
// page does not pretend otherwise (see report-1505.md for the full finding). `liveness: "dead"`
// becomes an explicit ZOMBIE chip instead of inline text.
// #1509/#1510: `attempt`/`maxAttempts` (WorkflowStatusStepView, ConsecutiveFailureCount-derived)
// and `failureKind`/`retryEligible` (the engine's own FailureClassification enum member name and
// RetryEngine.MayRetry's verdict) now do reach the payload per-step -- see FleetStatusTool.cs.
// Both stay presence-gated the same way liveness/try already are: a step with no retry history
// renders no attempt chip, a step that never failed renders no failure-kind chip.
// -----------------------------------------------------------------------------------------------
function attemptChip(step){
  if(!step || step.attempt == null) return null;
  const label = step.maxAttempts != null ? `attempt ${step.attempt}/${step.maxAttempts}` : `attempt ${step.attempt}`;
  return [label, "c-idle"];
}
function failureKindChip(step){
  if(!step || !step.failureKind) return null;
  const cls = step.retryEligible === true ? "c-warn" : step.retryEligible === false ? "c-bad" : "c-idle";
  return [step.failureKind.toUpperCase(), cls];
}
function chipsHtml(room, running, focusStep){
  const st = room.state;
  const chips = [];
  chips.push(st === "Running" ? ["RUNNING","c-run"]
    : st === "Failed" && room.rejected ? ["REJECTED","c-warn"]
    : st === "Succeeded" ? ["SUCCEEDED","c-ok"]
    : st === "Failed" ? ["FAILED","c-bad"]
    : st ? [st.toUpperCase(),"c-idle"] : ["UNREADABLE","c-warn"]);
  if(running && running.liveness === "dead") chips.push(["ZOMBIE","c-bad"]);
  const tb = timeboxChip(room, running);
  if(tb) chips.push(tb);
  const ac = attemptChip(focusStep);
  if(ac) chips.push(ac);
  const fc = failureKindChip(focusStep);
  if(fc) chips.push(fc);
  return chips.map(([label,cls]) => `<span class="chip ${cls}">${esc(label)}</span>`).join("");
}

// -----------------------------------------------------------------------------------------------
// #1505 item 3: per-room event timeline, content-free (pusher.py's extract_timeline keeps only
// type+timestamp), keyed by room PATH (never name -- fleet_status dedupes by path, and a
// name-keyed join could hand one room's timeline to a differently-rooted same-named room). Only
// present for rooms pusher.py judged non-terminal at push time.
// -----------------------------------------------------------------------------------------------
function timelineHtml(room, timelines){
  const entries = timelines && room.path ? timelines[room.path] : null;
  if(!Array.isArray(entries) || !entries.length) return "";
  const rows = entries.map(e => {
    const a = age(e.timestamp);
    return `<div class="tl-entry"><span class="tl-type mono">${esc(e.type)}</span><span class="tl-age">${a ? a + " ago" : ""}</span></div>`;
  }).join("");
  return `<details><summary>Timeline · ${entries.length}</summary>${rows}</details>`;
}

// -----------------------------------------------------------------------------------------------
// #1505 item 6: copy-the-verb. Never executes anything -- copies a CLI verb string to the
// clipboard for the operator to paste into their own Claude Code mobile session (spec/baton.md
// §10: origination and arrest both stay orchestrator-only). `redispatch` needs only the room
// path; `cancel`'s actual parser (CancelOptionsParser.cs) hard-requires --execution and
// --bindings, so the copied command only appears once a Running step's execution id is known,
// and always carries the full working invocation rather than a bare path that would fail if
// pasted verbatim -- see report-1505.md's labeled deviation note.
// -----------------------------------------------------------------------------------------------
function bindingsPathFor(roomPath){
  const sep = roomPath.includes("\\") && !roomPath.includes("/") ? "\\" : "/";
  return roomPath.replace(/[\\/]+$/, "") + sep + "bindings.json";
}
// The verb is copied to a clipboard and pasted into a real shell, so a `"` in a room path would
// otherwise terminate the quoted argument early and let anything after it execute (PR #1508 review).
// Escaping the quote-closer neutralizes that for both bash and pwsh double-quoted arguments; if a
// path still carries a raw newline (no legal filesystem produces one, but the payload isn't
// path-validated), refuse the button rather than emit a command that could span lines.
function shellArgSafe(s){ return !/[\r\n]/.test(s); }
function shq(s){ return s.replace(/"/g, '\\"'); }
function copyButtonHtml(verb, label){
  return `<button class="copybtn" data-verb="${esc(verb)}">${esc(label)}</button><input class="revealbox mono" readonly hidden>`;
}
function copyButtonsHtml(room, running){
  if(!room.path || !shellArgSafe(room.path)) return "";
  const buttons = [copyButtonHtml(`baton redispatch "${shq(room.path)}"`, "copy redispatch")];
  if(room.state === "Running" && running && running.execution){
    const cancelVerb = `baton cancel "${shq(room.path)}" --execution ${running.execution} --bindings "${shq(bindingsPathFor(room.path))}"`;
    buttons.push(copyButtonHtml(cancelVerb, "copy cancel"));
  }
  return `<div class="verbs">${buttons.join("")}</div>`;
}
async function copyToClipboard(text){
  try {
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e) { /* fall through to the execCommand fallback */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e) {
    return false;
  }
}
document.addEventListener("click", async (ev) => {
  const btn = ev.target.closest(".copybtn");
  if(!btn) return;
  const verb = btn.dataset.verb;
  const ok = await copyToClipboard(verb);
  const reveal = btn.nextElementSibling;
  if(ok){
    const orig = btn.textContent;
    btn.textContent = "copied";
    setTimeout(() => { btn.textContent = orig; }, 1500);
    if(reveal) reveal.hidden = true;
  } else if(reveal){
    // Sandboxed artifact contexts can deny both clipboard paths -- degrade to a tap-to-reveal,
    // select-all text field rather than silently doing nothing.
    reveal.hidden = false;
    reveal.value = verb;
    reveal.focus(); reveal.select();
  }
});

function laneHtml(room, timelines){
  const running = (room.steps||[]).find(s => s.state === "Running");
  const lastStep = (room.steps||[])[ (room.steps||[]).length - 1 ];
  // Chips key off the step that actually failed, not array position: in A->B->C with B
  // Permanent-failed and C still Pending, lastStep is C (carries no attempt/failureKind) and
  // neither chip would render even though B holds the data. Simultaneous Failed steps
  // (parallel branches) pick the first one in definition order -- an accepted heuristic.
  const failedStep = (room.steps||[]).find(s => s.state === "Failed");
  const focusStep = running || failedStep || lastStep;
  const bits = [];
  if(running){
    bits.push("step: " + esc(running.id));
    if(running.liveness === "unknown") bits.push("engine: unknown");
  }
  else if(lastStep) bits.push(esc(lastStep.id) + " " + esc(lastStep.state));
  const u = lastStep && (lastStep.usage || lastStep.linkedFromUsage);
  const tk = tokens(u); if(tk) bits.push(tk);
  const wc = u && dur(u.wallClockMs); if(wc) bits.push(wc);
  const err = room.error ? `<div class="ev" title="${esc(room.error)}">⛔ ${esc(room.error.slice(0,110))}</div>` : "";
  const tryLine = room.try ? `<div class="ev" title="${esc(room.try)}">↻ suggested: ${esc(room.try.slice(0,110))}</div>` : "";
  const t = newestStepTime(room);
  const a = age(t);
  const ageLine = a ? `<div class="age">last event ${a} ago${room.state === "Running" && t && (Date.now()-Date.parse(t)) > 15*60000 ? " ⚠" : ""}</div>` : "";
  const deliverables = room.name
    ? `<div class="deliverables"><a class="inboxlink" data-room="${esc(room.name)}">deliverables &rarr;</a></div>` : "";
  // #1499: a --label makes the room title the human-legible name (e.g. "the #1496 env-snapshot
  // lane") instead of its bare dispatch-<role>-<hex8> directory name; the room name never disappears
  // -- it drops to a secondary line so deliverables/redispatch/cancel still show what to paste.
  const title = room.label ? esc(room.label) : esc(room.name);
  const roomIdLine = room.label ? `<div class="roomid">${esc(room.name)}</div>` : "";
  return `<div class="lane"><div class="top"><span class="name">${title}</span><span class="chips">${chipsHtml(room, running, focusStep)}</span></div>
    ${roomIdLine}
    ${bindingLineHtml(room)}
    ${bits.length ? `<div class="ev">${bits.join(" · ")}</div>` : ""}${tryLine}${err}${ageLine}
    ${timelineHtml(room, timelines)}
    ${copyButtonsHtml(room, running)}
    ${deliverables}</div>`;
}
function underhoodHtml(list){
  if(!Array.isArray(list) || !list.length) return "";
  const rows = list.map(w => {
    const commitAge = w.last_commit_at ? age(w.last_commit_at) : null;
    const bits = [];
    if(w.branch) bits.push(`<span class="mono">${esc(w.branch)}</span>`);
    if(w.uncommitted) bits.push(esc(w.uncommitted));
    const commit = w.last_commit ? `<div class="ev">last commit: ${esc(w.last_commit)}${commitAge ? ` · ${esc(commitAge)} ago` : ""}</div>` : "";
    return `<div class="lane"><div class="top"><span class="name">${esc(w.name)}</span></div>
      <div class="ev">${bits.join(" · ")}</div>${commit}</div>`;
  }).join("");
  return `<h2>Under the hood · ${list.length}</h2>` + rows;
}
function render(rooms, pushedAt, underhood, heartbeatAt, timelines, staleHiddenCount){
  const running = rooms.filter(r => r.state === "Running");
  const failed  = rooms.filter(r => r.state === "Failed");
  const done    = rooms.filter(r => r.state === "Succeeded");
  const other   = rooms.filter(r => !r.state);
  const byNewest = (a,b) => (newestStepTime(b)||"").localeCompare(newestStepTime(a)||"");
  running.sort(byNewest); failed.sort(byNewest); done.sort(byNewest);
  let html = underhoodHtml(underhood);
  html += `<h2>Running · ${running.length}</h2>` + (running.map(r => laneHtml(r, timelines)).join("") || `<div class="lane"><div class="ev">none</div></div>`);
  html += `<h2>Failed · ${failed.length}</h2>` + (failed.slice(0,12).map(r => laneHtml(r, timelines)).join("") || `<div class="lane"><div class="ev">none</div></div>`);
  html += `<details><summary>Succeeded · ${done.length}</summary>${done.slice(0,40).map(r => laneHtml(r, timelines)).join("")}</details>`;
  if(other.length) html += `<details><summary>Unreadable entries · ${other.length}</summary>${other.slice(0,20).map(r => laneHtml(r, timelines)).join("")}</details>`;
  $("content").innerHTML = html;
  $("fresh").textContent = freshLabel(pushedAt, "pushed ") || "push time unknown";
  const hb = freshLabel(heartbeatAt, "pusher alive ");
  if(hb) $("fresh").textContent += " · " + hb;
  // #1505 landmine #43: a stale-room drop is now a visible count, never silence.
  $("stalenote").textContent = staleHiddenCount
    ? `${staleHiddenCount} room(s) hidden — older than the pusher's retention window`
    : "";
}
// "pushed X ago" measures the SNAPSHOT (legitimately stale on a quiet fleet, #1457's change-gate);
// "pusher alive X ago" measures the PUSHER PROCESS itself (hourly heartbeat, #1486) -- the two are
// deliberately independent so a quiet fleet with an old snapshot still reads as healthy.
function freshLabel(iso, prefix){
  if(!iso) return null;
  const a = age(iso);
  return prefix + (a || new Date(iso).toLocaleTimeString()) + (a && a !== "just now" ? " ago" : "");
}
function banner(html){ $("banner").innerHTML = html ? `<div class="banner">${html}</div>` : ""; }

// -----------------------------------------------------------------------------------------------
// Deliverables inbox (#1413, merged into this artifact as a tab by #1505 item 4). Same data
// contract as the deleted inbox.html: deliverables_list({room?}) -> {items, count},
// deliverable_read({id}) -> full text. Markdown rendering stays DELIBERATELY MINIMAL (headings,
// code fences, bold/italic, links, bullet lists, paragraphs) -- enough for this pipeline's own
// report markdown, not a general CommonMark implementation. Everything is HTML-escaped before any
// markup is applied.
// -----------------------------------------------------------------------------------------------
function verdictChip(v){
  const state = typeof v === "string" ? v : (v && v.state);
  if(!state) return ["?","c-idle"];
  const upper = state.toUpperCase();
  if(upper === "SUCCEEDED" || upper === "OK" || upper === "APPROVE" || upper === "APPROVED" || upper === "PASS" || upper === "PASSED") return [typeof v === "string" ? upper : "OK", "c-ok"];
  if(upper === "FAILED" || upper === "REQUEST-CHANGES" || upper === "REQUEST_CHANGES" || upper === "FAIL" || upper === "REJECT" || upper === "REJECTED") return [typeof v === "string" ? upper : "FAILED", "c-bad"];
  if(upper === "WARN" || upper === "WARNING") return [upper, "c-warn"];
  return [upper, "c-idle"];
}
function findingSeverityChip(sev){
  if(!sev) return null;
  const s = String(sev).toLowerCase();
  if(s === "high" || s === "critical" || s === "error") return [s.toUpperCase(), "c-bad"];
  if(s === "medium" || s === "med" || s === "warn" || s === "warning") return [s.toUpperCase(), "c-warn"];
  if(s === "low" || s === "info") return [s.toUpperCase(), "c-idle"];
  return [s.toUpperCase(), "c-idle"];
}
function findingStatusChip(st){
  if(!st) return null;
  const s = String(st).toLowerCase();
  if(s === "confirmed") return [s.toUpperCase(), "c-ok"];
  if(s === "refuted") return [s.toUpperCase(), "c-idle"];
  if(s === "unverified") return [s.toUpperCase(), "c-warn"];
  return [s.toUpperCase(), "c-idle"];
}
function findingHtml(f){
  if(!f || typeof f !== "object") return `<div class="finding"><div class="finding-claim">${esc(String(f))}</div></div>`;
  const claim = f.claim || f.title || "";
  const chips = [];
  const sev = findingSeverityChip(f.severity);
  if(sev) chips.push(`<span class="chip ${sev[1]}">${esc(sev[0])}</span>`);
  const st = findingStatusChip(f.status);
  if(st) chips.push(`<span class="chip ${st[1]}">${esc(st[0])}</span>`);

  let anchor = "";
  if(f.anchor){
    if(typeof f.anchor === "object"){
      const file = f.anchor.file || "";
      const line = f.anchor.line != null ? `:${f.anchor.line}` : "";
      if(file) anchor = `<div class="finding-anchor mono">${esc(file + line)}</div>`;
    } else if(typeof f.anchor === "string"){
      anchor = `<div class="finding-anchor mono">${esc(f.anchor)}</div>`;
    }
  }
  const detail = f.detail || f.body || "";
  const detailHtml = detail ? `<div class="finding-detail">${esc(detail)}</div>` : "";
  return `<div class="finding">
    <div class="finding-top">
      <span class="finding-claim">${esc(claim || "Finding")}</span>
      ${chips.length ? `<span class="finding-chips">${chips.join("")}</span>` : ""}
    </div>
    ${anchor}
    ${detailHtml}
  </div>`;
}
function formatMetaValue(val){
  if(val == null) return "—";
  if(typeof val === "string") return esc(val);
  if(typeof val === "number" || typeof val === "boolean") return esc(String(val));
  return `<pre><code>${esc(JSON.stringify(val, null, 2))}</code></pre>`;
}
function renderVerdictDoc(data){
  const dts = [];
  for(const k of Object.keys(data)){
    if(k === "findings" || k === "verdict") continue;
    dts.push(`<dt>${esc(k)}</dt><dd>${formatMetaValue(data[k])}</dd>`);
  }
  const metaHtml = dts.length ? `<dl>${dts.join("")}</dl>` : "";
  let findingsHtml = "";
  if(Array.isArray(data.findings)){
    const items = data.findings.map(findingHtml).join("");
    findingsHtml = `<h3>Findings · ${data.findings.length}</h3>` + (items || `<div class="empty">No findings recorded.</div>`);
  }
  return metaHtml + findingsHtml;
}
function renderMarkdown(text){
  const lines = esc(text ?? "").split("\n");
  let html = "";
  let inCode = false, inList = false;
  let para = [], table = [];
  const flushPara = () => {
    if(para.length){
      html += `<p>${inline(para.join(" "))}</p>`;
      para = [];
    }
  };
  const flushTable = () => {
    if(table.length){
      html += `<pre><code>${table.join("\n")}</code></pre>`;
      table = [];
    }
  };
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, u) => /^https?:\/\//.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : m);
  for(const raw of lines){
    if(raw.trim().startsWith("```")){
      flushPara();
      flushTable();
      if(inList){ html += "</ul>"; inList = false; }
      html += inCode ? "</code></pre>" : "<pre><code>";
      inCode = !inCode;
      continue;
    }
    if(inCode){ html += raw + "\n"; continue; }
    const heading = raw.match(/^(#{1,6})\s+(.*)$/);
    if(heading){
      flushPara();
      flushTable();
      if(inList){ html += "</ul>"; inList = false; }
      const level = heading[1].length;
      html += `<h${level}>${inline(heading[2])}</h${level}>`;
      continue;
    }
    const bullet = raw.match(/^\s*[-*]\s+(.*)$/);
    if(bullet){
      flushPara();
      flushTable();
      if(!inList){ html += "<ul>"; inList = true; }
      html += `<li>${inline(bullet[1])}</li>`;
      continue;
    }
    if(raw.trim() === ""){
      flushPara();
      flushTable();
      if(inList){ html += "</ul>"; inList = false; }
      continue;
    }
    if(/^\s*\|/.test(raw)){
      flushPara();
      if(inList){ html += "</ul>"; inList = false; }
      table.push(raw);
      continue;
    }
    flushTable();
    if(inList){ html += "</ul>"; inList = false; }
    para.push(raw.trim());
  }
  flushPara();
  flushTable();
  if(inList) html += "</ul>";
  if(inCode) html += "</code></pre>";
  return html;
}
function itemRow(item){
  const [label, cls] = verdictChip(item.verdict);
  const a = age(item.created_at || item.pushed_at);
  const withheld = item.withheld ? ` · <span title="${esc(item.stub_reason || "")}">withheld</span>` : "";
  return `<div class="item" data-id="${esc(item.id)}">
    <div class="top"><span class="title">${esc(item.title || item.artifact || item.id)}</span><span class="chip ${cls}">${label}</span></div>
    <div class="meta">${esc(item.room)}${item.artifact ? " · " + esc(item.artifact) : ""} · ${a ? a + " ago" : "?"}${withheld}</div>
  </div>`;
}
function renderInboxList(items, roomFilter){
  $("filter").innerHTML = roomFilter
    ? `filtered to room <b>${esc(roomFilter)}</b> · <a id="clearfilter">clear</a>`
    : "";
  const clear = $("clearfilter");
  if(clear) clear.addEventListener("click", () => { inboxRoomFilter = ""; location.hash = "#inbox"; applyRoute(); });
  $("inboxcontent").innerHTML = items.length
    ? items.map(itemRow).join("")
    : `<div class="empty">No deliverables ${roomFilter ? "for this room " : ""}yet.</div>`;
  for(const el of document.querySelectorAll("#inboxcontent .item")){
    el.addEventListener("click", () => { location.hash = "#inbox:" + encodeURIComponent(el.dataset.id); });
  }
}
function renderInboxDoc(item, text){
  let parsed = null;
  if(typeof text === "string" && text.trim()){
    try { parsed = JSON.parse(text); } catch { parsed = null; }
  }
  const isVerdictShaped = parsed && typeof parsed === "object" && !Array.isArray(parsed) && (
    Array.isArray(parsed.findings) || typeof parsed.verdict === "string"
  );
  const verdictForChip = (isVerdictShaped && typeof parsed.verdict === "string") ? parsed.verdict : (item && item.verdict);
  const [label, cls] = verdictChip(verdictForChip);
  const verdict = item && item.verdict;
  const verdictLine = verdict
    ? `<div class="meta">${esc(verdict.state || "?")}${verdict.error ? " — " + esc(verdict.error) : ""}${verdict.try ? " (" + esc(verdict.try) + ")" : ""}</div>`
    : "";

  let docHtml = "";
  if(isVerdictShaped){
    docHtml = renderVerdictDoc(parsed);
  } else if(parsed !== null){
    docHtml = `<pre><code>${esc(JSON.stringify(parsed, null, 2))}</code></pre>`;
  } else {
    docHtml = renderMarkdown(text);
  }

  $("inboxcontent").innerHTML = `
    <a class="back" id="inboxback">&larr; back to inbox</a>
    <h2>${esc((item && (item.title || item.artifact)) || "")} <span class="chip ${cls}">${label}</span></h2>
    ${verdictLine}
    <div class="doc">${docHtml}</div>`;
  $("inboxback").addEventListener("click", () => { location.hash = "#inbox"; });
}

// -----------------------------------------------------------------------------------------------
// Tabs + hash routing. "" = Fleet; "#inbox" = inbox list; "#inbox:<id>" = one inbox item. Clicking
// a room's "deliverables →" link sets the in-memory room filter and switches tabs client-side --
// no navigation, since this is one page now (#1505 item 4).
// -----------------------------------------------------------------------------------------------
let inboxRoomFilter = new URLSearchParams(location.search).get("room") || "";
let inboxIndex = [];
function applyRoute(){
  const h = location.hash;
  const onInbox = h === "#inbox" || h.startsWith("#inbox:");
  $("tab-fleet").classList.toggle("active", !onInbox);
  $("tab-inbox").classList.toggle("active", onInbox);
  $("tab-btn-fleet").classList.toggle("active", !onInbox);
  $("tab-btn-inbox").classList.toggle("active", onInbox);
  if(!onInbox) return;
  if(h.startsWith("#inbox:")){
    const id = decodeURIComponent(h.slice(7));
    const item = inboxIndex.find((m) => m.id === id) || { id };
    if(!window.mcpHandle) return;
    window.mcpHandle.watchTool("baton", "deliverable_read", { id }, (ev) => {
      if(ev.type === "data"){
        let text = ev.result.payload;
        if(typeof text !== "string") text = JSON.stringify(text);
        renderInboxDoc(item, text);
      }
    }, { refetchInterval: 0 });
  } else {
    const items = inboxRoomFilter ? inboxIndex.filter((m) => m.room === inboxRoomFilter) : inboxIndex;
    renderInboxList(items, inboxRoomFilter);
  }
}
document.addEventListener("click", (ev) => {
  const tabBtn = ev.target.closest(".tabbtn");
  if(tabBtn){
    location.hash = tabBtn.dataset.tab === "inbox" ? "#inbox" : "";
    return;
  }
  const inboxLink = ev.target.closest(".inboxlink");
  if(inboxLink){
    inboxRoomFilter = inboxLink.dataset.room || "";
    location.hash = "#inbox";
  }
});
window.addEventListener("hashchange", applyRoute);

(async () => {
  const mcp = await claude.use("mcp");
  if(!mcp){
    banner("<b>No MCP in this view.</b> The fleet feed comes from the <span class='mono'>baton</span> connector; this surface cannot reach connectors.");
    $("fresh").textContent = "static";
    applyRoute();
    return;
  }
  window.mcpHandle = mcp;
  let lastGood = null;
  // #1486: heartbeat_at (hourly ping, independent of the change-gated snapshot) is what tells a
  // dead pusher apart from a quiet fleet whose pushed_at is legitimately stale. Loud only past
  // ~2 missed beats + slop, so one delayed cycle doesn't cry wolf.
  const HEARTBEAT_DEAD_MS = 2.5 * 60 * 60 * 1000;
  const RUNNING_SUSPICION_MS = 10 * 60 * 1000;
  mcp.watchTool("baton", "fleet_status", {}, (ev) => {
    if(ev.type === "data"){
      let snap = ev.result.payload;
      if(typeof snap === "string"){ try { snap = JSON.parse(snap); } catch { snap = null; } }
      if(snap && Array.isArray(snap.rooms)){
        lastGood = snap;
        const hbMs = snap.heartbeat_at ? Date.now() - Date.parse(snap.heartbeat_at) : null;
        const pushMs = snap.pushed_at ? Date.now() - Date.parse(snap.pushed_at) : null;
        const running = snap.rooms.some(r => r.state === "Running");
        if(hbMs == null){
          banner("<b>No heartbeat recorded yet.</b> heartbeat_at is unset — redeploy worker.js and the pusher for #1486, or the mailbox hasn't received one yet.");
        } else if(!isFinite(hbMs) || hbMs > HEARTBEAT_DEAD_MS){
          banner(`<b>Pusher likely dead.</b> No heartbeat in ${esc(age(snap.heartbeat_at) || "over 2.5h")} — the fleet machine may be off or the pusher process may have stopped. Data below is from the last push.`);
        } else if(running && pushMs != null && isFinite(pushMs) && pushMs > RUNNING_SUSPICION_MS){
          banner(`<b>Snapshot may be stuck.</b> The pusher is alive (heartbeat ${esc(age(snap.heartbeat_at))} ago) but the last push was ${esc(age(snap.pushed_at))} ago while rooms show Running — snapshot derivation itself may be wedged.`);
        } else {
          banner("");
        }
        render(snap.rooms, snap.pushed_at, snap.underhood, snap.heartbeat_at, snap.timelines, snap.stale_hidden_count);
      } else if(snap && snap.rooms === null){
        $("content").innerHTML = "";
        banner("<b>No snapshot pushed yet.</b> The mailbox is live but the fleet machine hasn't pushed data.");
        $("fresh").textContent = "empty mailbox";
      }
      return;
    }
    const e = ev.error || {};
    if(e.code === "server_not_connected"){
      if(lastGood){ banner("<b>Feed lost.</b> The baton connector is not reachable — data below is the last snapshot."); }
      else { banner("<b>The baton connector is not connected in this view.</b> Add it once via Settings → Connectors → Add custom (or the connector prompt this page raises), then reload."); $("fresh").textContent = "no feed"; }
    } else if(e.code === "needs_reauth" || e.code === "blocked_by_policy" || e.code === "approval_required"){
      $("content").innerHTML = "";
      banner(`<b>Access denied</b> (${esc(e.code)}). ${esc(e.message || "")}`);
      $("fresh").textContent = "no feed";
    } else if(e.code === "tool_error"){
      banner(`<b>fleet_status reported failure:</b> ${esc(e.message || "")}` + (lastGood ? " — showing last good data." : ""));
    } else {
      if(!lastGood){ banner(`<b>No data yet</b> (${esc(e.code || "unknown")}). ${esc(e.message || "")}`); }
    }
  }, { refetchInterval: 30000, cache: { staleTime: 25000 } });

  mcp.watchTool("baton", "deliverables_list", {}, (ev) => {
    if(ev.type === "data"){
      let payload = ev.result.payload;
      if(typeof payload === "string"){ try { payload = JSON.parse(payload); } catch { payload = null; } }
      inboxIndex = (payload && Array.isArray(payload.items)) ? payload.items : [];
      if(!location.hash.startsWith("#inbox:")) applyRoute();
      return;
    }
    const e = ev.error || {};
    $("inboxbanner").innerHTML = `<div class="banner"><b>Inbox feed unavailable</b> (${esc(e.code || "unknown")}). ${esc(e.message || "")}</div>`;
  }, { refetchInterval: 30000, cache: { staleTime: 25000 } });

  applyRoute();
})();
</script>

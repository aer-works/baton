<!--
  Fleet Glass — the operator's primary observability surface (Baton Spike 1;
  provenance in worker.js's header). #1505 (glass v2 core, epic #1502) merged the deliverables
  inbox into this same artifact as a second tab -- ONE artifact URL identity now, never two
  bookmarks/connector prompts for one operator (menu item #45). inbox.html is deleted; this file's
  own name is the artifact's filename identity and does not change.

  This is a Claude.ai ARTIFACT, not a plain static page: it declares the `mcp` capability and
  watches the `fleet_status` / `deliverables_list` / `deliverable_read` tools on a custom MCP
  connector named "baton" (Settings -> Connectors -> Add custom -> the Worker's
  /mcp/<READ_SEGMENT> URL from tools/fleet-glass/secrets.local.json). Data flows fleet machine ->
  pusher.py -> Worker (worker.js) -> KV -> this page, on a 30s poll, with the viewer's own
  connector credentials. Read-only: no write verbs execute anywhere in this file -- the two
  clipboard buttons per room COPY a CLI verb string for the operator to paste into their own
  Claude Code mobile session; nothing here calls baton or the engine directly (spec/baton.md §10:
  origination and arrest both stay orchestrator-only from this page).

  role/adapter/model/effort/timeoutMs (engine PR #1504, epic #1502 item #5/#6/#7; #1613 item 3
  carries them through the terminal-sentinel fast path too, when bindings.json names exactly one
  role) are read ABSENT-SAFE throughout: every reference below is behind a truthiness/null check,
  so this page renders identically whether or not the producing pusher/engine has been redeployed
  -- an unredeployed pair simply never sets these fields, same as any other optional fleet_status
  field.

  Timeline entries (menu item #1/#2, extended by #1613 item 4) are content-free by construction
  (pusher.py's `extract_timeline` keeps only event type, timestamp, stepId, and exitCode -- ids and
  counts, never stdout, per the operator's 2026-09-01 ruling amending the content-free
  construction) and, since #1613, exist for TERMINAL rooms too (fetched once, cached) -- pre-#1613
  a finished lane showed no Timeline section at all.

  `room.live` (#1613 item 1: toolCalls/lastActivityAt, plus claude-only output/context token counts
  since a 2026-09-01 review finding, for a Running room's currently-executing step) is absent-safe
  the same way -- see `liveTelemetryHtml`'s own comment for the token fields' exact gating.

  `derived_at` (#1613 item 2) is what the "Snapshot derivation may be stuck" banner keys on instead
  of pushed_at, and `pending_push_age_s` (2026-09-01 review finding) is the "Push failing" banner's
  own signal -- see the banner code's own comments below for why pushed_at alone false-fired and why
  derived_at alone cannot see a failing push.
-->

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

function age(iso){
  if(!iso) return null;
  const ms = Date.now() - Date.parse(iso);
  if(!isFinite(ms) || ms < 0) return null;
  const m = Math.floor(ms/60000);
  if(m < 1) return "just now";
  if(m < 60) return m + "m";
  const h = Math.floor(m/60);
  if(h < 48) return h + "h";
  return Math.floor(h/24) + "d";
}
// #1656: the connector's own error object for a failed tool call (e.g. `code: "upstream_error"`,
// measured 2026-09-02 against a 160,539-byte deliverables_list body) carries no message beyond a
// generic "request failed" -- useless for telling "the worker 500'd" apart from "the response was
// too big for this view to swallow". When the connector DOES attach more (field names are
// best-effort across connector versions -- `status`/`httpStatus` and `responseSize`/`size`/
// `bytes`), surface those instead of the generic text; degrade to `e.message`, then the bare code,
// only when neither is present.
function upstreamErrorDetail(e){
  if(e.code !== "upstream_error") return e.message || "";
  const status = e.status ?? e.httpStatus ?? e.statusCode;
  const size = e.responseSize ?? e.size ?? e.bytes ?? e.contentLength;
  const bits = [];
  if(status != null) bits.push(`HTTP ${status}`);
  if(size != null) bits.push(`${size} bytes`);
  if(bits.length) return `upstream returned ${bits.join(", ")}`;
  return e.message || "upstream request failed (no further detail from the connector)";
}
function dur(msVal){
  if(msVal == null) return null;
  const m = Math.round(msVal/60000);
  return m < 1 ? Math.round(msVal/1000) + "s" : m + "m";
}
function tokens(u){
  if(!u || u.tokensIn == null) return null;
  const t = (u.tokensIn + (u.tokensOut||0))/1000;
  return Math.round(t) + "k tok";
}
// #1613 review (live tokens): compact "12.4k"/"68k" formatting for room.live's outputTokens/
// contextTokens -- one decimal place below 10k for readability, whole numbers at or above it
// (matches how large the raw counts actually get), plain digits under 1k.
function fmtK(n){
  if(!(typeof n === "number") || !isFinite(n)) return String(n);
  if(n < 1000) return String(n);
  const k = n/1000;
  const rounded = k >= 10 ? Math.round(k) : Math.round(k*10)/10;
  return rounded + "k";
}
function newestStepTime(room){
  let newest = null;
  for(const s of room.steps || []){
    if(s.timestamp && (!newest || s.timestamp > newest)) newest = s.timestamp;
  }
  return newest;
}

// -----------------------------------------------------------------------------------------------
// #1618: project workspace sub-line (the room's projectRoot, emitted by FleetStatusTool.cs:458-460).
// Displays the tail (last one or two segments, e.g. repos\w1614) with full path in title tooltip.
// Absent-safe: rooms with no project render nothing.
// -----------------------------------------------------------------------------------------------
function projectTail(path){
  if(!path || typeof path !== "string") return "";
  const cleaned = path.trim().replace(/[\\/]+$/, "");
  if(!cleaned) return "";
  const sep = cleaned.includes("\\") && !cleaned.includes("/") ? "\\" : "/";
  const parts = cleaned.split(/[\\/]+/).filter(Boolean);
  if(!parts.length) return "";
  return parts.slice(-2).join(sep);
}
function projectLineHtml(room){
  if(!room || !room.project) return "";
  const tail = projectTail(room.project);
  if(!tail) return "";
  return `<div class="project" title="${esc(room.project)}">${esc(tail)}</div>`;
}

// -----------------------------------------------------------------------------------------------
// #1505 item 1: binding fields (role/adapter/model/effort, engine PR #1504) + client-derived
// timebox remaining (timeoutMs - (now - the Running step's own timestamp), both absent-safe).
// -----------------------------------------------------------------------------------------------
function bindingLineHtml(room){
  const bits = [];
  if(room.role) bits.push(esc(room.role));
  if(room.adapter) bits.push(esc(room.adapter));
  if(room.model) bits.push(esc(room.model));
  if(room.effort) bits.push(esc(room.effort));
  return bits.length ? `<div class="ev mono">${bits.join(" · ")}</div>` : "";
}
function timeboxChip(room, running){
  if(!running || room.timeoutMs == null || !running.timestamp) return null;
  const elapsedMs = Date.now() - Date.parse(running.timestamp);
  if(!isFinite(elapsedMs)) return null;
  const remainingMs = room.timeoutMs - elapsedMs;
  const mins = Math.round(Math.abs(remainingMs)/60000);
  return remainingMs >= 0 ? [`⏳ ${mins}m left`, "c-idle"] : [`overdue ${mins}m`, "c-bad"];
}

// -----------------------------------------------------------------------------------------------
// #1505 item 2: honest failure rendering. `try` is corrected-invocation text (a pre-ledger
// refusal's suggested command, spec/baton.md §3), NOT a retry-attempt counter -- the epic
// brainstorm's "try counter" framing does not match what FleetStatusTool actually emits, and this
// page does not pretend otherwise (see report-1505.md for the full finding). `liveness: "dead"`
// becomes an explicit ZOMBIE chip instead of inline text.
// #1509/#1510/#1522: `attempt`/`maxAttempts` (WorkflowStatusStepView, lifetime execution-count derived)
// and `failureKind`/`retryEligible` (the engine's own FailureClassification enum member name and
// RetryEngine.MayRetry's verdict) now do reach the payload per-step -- see FleetStatusTool.cs.
// Both stay presence-gated the same way liveness/try already are: a step that hasn't executed
// renders no attempt chip, a step that never failed renders no failure-kind chip.
// #1522 review finding 3: `attempt` (lifetime execution ordinal) and `maxAttempts` (the per-round
// retry budget, ConsecutiveFailureCount basis) do not share a denominator -- RetryWithRevision can
// push `attempt` past `maxAttempts` (e.g. attempt 4 against a MaxAttempts of 3), and an
// ExhaustedUntil outcome increments `attempt` while spending no retry budget. The chip renders
// `attempt` alone; it never builds an "N/M" ratio from the two.
// -----------------------------------------------------------------------------------------------
function attemptChip(step){
  if(!step || step.attempt == null) return null;
  return [`attempt ${step.attempt}`, "c-idle"];
}
function failureKindChip(step){
  if(!step || !step.failureKind) return null;
  const cls = step.retryEligible === true ? "c-warn" : step.retryEligible === false ? "c-bad" : "c-idle";
  return [step.failureKind.toUpperCase(), cls];
}
// -----------------------------------------------------------------------------------------------
// #1551: `step.exhaustedUntil` is the vendor-quota park's own reset instant (WorkflowStatusStepView,
// gated to an actual ExhaustedUntil park with a recorded obligation -- absent for an un-obligated
// park or an ordinary Retryable backoff, same presence-gated convention as failureKindChip above).
// Absolute + relative, mirroring timeboxChip's future/overdue duality above it -- but a Failed step
// whose OWN liveness reads "dead" (#1513) has no scheduler left to fire this at all: a live
// countdown there would be dishonest, so that arm renders the same past instant as a flat fact
// instead -- and per #1598 review F1, a bare clock time ("was due 21:59") can't tell tonight from
// three days ago, so the dead arm renders the relative span instead ("was due 3d ago — no
// scheduler"), never a fake countdown. `parkLadder` below is a local m→h→d ladder (deliberately not
// `age()`: that one returns null for negative spans and floors "just now", neither of which fits a
// duration that can be future OR past) -- and it's what keeps a far-future (#1183-shaped) instant
// rendering as "2914d" rather than a multi-million-minute count. When the target instant falls on a
// different calendar day than now, the clock parenthetical gets the date prefixed (StatusCommand.cs
// FormatParkedStatus's rationale: parks span days, a bare clock time is ambiguous -- the chip must
// not reintroduce the ambiguity the human path already removed). `Date.parse`/`toLocaleTimeString`
// do not throw on a far-future instant -- `isFinite` below is what a genuinely unparseable one falls
// back through, same as `age()`/`timeboxChip`.
// -----------------------------------------------------------------------------------------------
function parkLadder(ms){
  const m = Math.floor(ms/60000);
  if(m < 60) return m + "m";
  const h = Math.floor(m/60);
  if(h < 48) return h + "h";
  return Math.floor(h/24) + "d";
}
function parkChip(step){
  if(!step || !step.exhaustedUntil) return null;
  const target = Date.parse(step.exhaustedUntil);
  if(!isFinite(target)) return null;
  const targetDate = new Date(target);
  const now = new Date();
  const crossesDay = targetDate.toDateString() !== now.toDateString();
  const clock = (crossesDay ? targetDate.toLocaleDateString([], {month: "short", day: "numeric"}) + " " : "")
    + targetDate.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit"});
  const diffMs = target - Date.now();
  const rel = parkLadder(Math.abs(diffMs));
  if(step.liveness === "dead"){
    return [`was due ${rel} ago — no scheduler`, "c-warn"];
  }
  return diffMs >= 0
    ? [`resumes in ${rel} (${clock})`, "c-idle"]
    : [`overdue ${rel} (${clock})`, "c-bad"];
}
function chipsHtml(room, running, focusStep){
  const st = room.state;
  const chips = [];
  chips.push(st === "Running" ? ["RUNNING","c-run"]
    : st === "Failed" && room.rejected ? ["REJECTED","c-warn"]
    : st === "Succeeded" ? ["SUCCEEDED","c-ok"]
    : st === "Failed" ? ["FAILED","c-bad"]
    // #1582: Stalled means a scheduled retry with no scheduler left to fire it -- nothing moves
    // it without a person, so it gets the "needs you" colour, never the idle grey the generic
    // fallback below would give an unrecognized state.
    : st === "Stalled" ? ["STALLED","c-warn"]
    // #1586 S1: Indeterminate means journal facts alone could not decide success vs failure -- a
    // conductor has to look, same "needs you" colour as Stalled, distinct label. Producer since
    // #1608 (WorkflowOutcome.Indeterminate's own remarks) -- baton resolve is the way out.
    : st === "Indeterminate" ? ["INDETERMINATE","c-warn"]
    : st ? [st.toUpperCase(),"c-idle"] : ["UNREADABLE","c-warn"]);
  if(running && running.liveness === "dead") chips.push(["ZOMBIE","c-bad"]);
  const tb = timeboxChip(room, running);
  if(tb) chips.push(tb);
  const ac = attemptChip(focusStep);
  if(ac) chips.push(ac);
  const fc = failureKindChip(focusStep);
  if(fc) chips.push(fc);
  const pc = parkChip(focusStep);
  if(pc) chips.push(pc);
  return chips.map(([label,cls]) => `<span class="chip ${cls}">${esc(label)}</span>`).join("");
}

// -----------------------------------------------------------------------------------------------
// #1505 item 3 & #1536: per-room event timeline, content-free (pusher.py's extract_timeline keeps
// only type+timestamp), keyed by room PATH (never name -- fleet_status dedupes by path, and a
// name-keyed join could hand one room's timeline to a differently-rooted same-named room).
// #1536 item 1: timelines are persisted across page refreshes in localStorage (try/catch-wrapped,
// capped at 100 entries per room, absent rooms dropped).
// #1536 item 2: raw event types map to friendly legible names with raw types in title tooltips.
// -----------------------------------------------------------------------------------------------
const TIMELINE_STORAGE_KEY = "baton.glass.timelines";
const TIMELINE_ROOM_CAP = 100;

const EVENT_NAMES = {
  // Flow events (FlowEvent.cs)
  "flow.executionRequestAccepted": "worker accepted",
  "executionRequestAccepted": "worker accepted",
  "flow.executionRequestRejected": "worker rejected",
  "executionRequestRejected": "worker rejected",
  "flow.executionSucceeded": "execution succeeded",
  "executionSucceeded": "execution succeeded",
  "flow.executionFailed": "execution failed",
  "executionFailed": "execution failed",
  "flow.executionCancelled": "execution cancelled",
  "executionCancelled": "execution cancelled",
  "flow.cancellationRequested": "cancellation requested",
  "cancellationRequested": "cancellation requested",
  "flow.workflowPaused": "workflow paused",
  "workflowPaused": "workflow paused",
  "flow.externalDecisionRecorded": "decision recorded",
  "externalDecisionRecorded": "decision recorded",
  "flow.workflowResumed": "workflow resumed",
  "workflowResumed": "workflow resumed",
  "flow.stepRetryScheduled": "retry scheduled",
  "stepRetryScheduled": "retry scheduled",
  "flow.executionIndeterminate": "execution indeterminate",
  "executionIndeterminate": "execution indeterminate",
  "flow.captureResolved": "capture resolved",
  "captureResolved": "capture resolved",
  "flow.verifyStarted": "verify started",
  "verifyStarted": "verify started",
  "flow.verifyPassed": "verify passed",
  "verifyPassed": "verify passed",
  "flow.verifyFailed": "verify failed",
  "verifyFailed": "verify failed",

  "executionStarted": "execution started",
  "core.executionExited": "execution exited",
  "executionExited": "execution exited",

  // Room events (RoomEvent.cs)
  "room.heldWorkDispatched": "held work dispatched",
  "heldWorkDispatched": "held work dispatched",
  "room.heldWorkEscalated": "held work escalated",
  "heldWorkEscalated": "held work escalated",
  "room.heldWorkResolved": "held work resolved",
  "heldWorkResolved": "held work resolved",
  "room.grantRecorded": "grant recorded",
  "grantRecorded": "grant recorded",
  "room.grantAmended": "grant amended",
  "grantAmended": "grant amended",
  "room.grantRevoked": "grant revoked",
  "grantRevoked": "grant revoked",
  "room.escalationRaised": "escalation raised",
  "escalationRaised": "escalation raised",
  "room.turnHostDormancyEntered": "dormancy entered",
  "turnHostDormancyEntered": "dormancy entered",
  "room.turnHostDormancyCleared": "dormancy cleared",
  "turnHostDormancyCleared": "dormancy cleared",
  "room.runtimePermissionAsked": "permission asked",
  "runtimePermissionAsked": "permission asked",
  "room.runtimePermissionAnswered": "permission answered",
  "runtimePermissionAnswered": "permission answered",
  "room.runtimePermissionRevoked": "permission revoked",
  "runtimePermissionRevoked": "permission revoked",
  "room.workflowSwitched": "workflow switched",
  "workflowSwitched": "workflow switched",
  "room.standingPermissionRevoked": "standing permission revoked",
  "standingPermissionRevoked": "standing permission revoked",
  "room.workerJoined": "worker joined",
  "workerJoined": "worker joined",
  "room.workerRenamed": "worker renamed",
  "workerRenamed": "worker renamed",
  "room.orchestratorAssigned": "orchestrator assigned",
  "orchestratorAssigned": "orchestrator assigned",

  // Special / synthetic
  "unreadable": "unreadable",
  "unknown": "unknown",
};

function friendlyEventName(rawType){
  if(!rawType) return "";
  if(EVENT_NAMES[rawType]) return EVENT_NAMES[rawType];
  const unprefixed = String(rawType).replace(/^(flow|core|room)\./, "");
  if(EVENT_NAMES[unprefixed]) return EVENT_NAMES[unprefixed];
  return String(rawType);
}

function loadPersistedTimelines(){
  try {
    if(typeof localStorage === "undefined" || !localStorage) return {};
    const raw = localStorage.getItem(TIMELINE_STORAGE_KEY);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    return (parsed && typeof parsed === "object" && !Array.isArray(parsed)) ? parsed : {};
  } catch(e) {
    return {};
  }
}

function savePersistedTimelines(timelines){
  try {
    if(typeof localStorage === "undefined" || !localStorage) return;
    if(!timelines || typeof timelines !== "object") return;
    localStorage.setItem(TIMELINE_STORAGE_KEY, JSON.stringify(timelines));
  } catch(e) {
    // Storage access blocked or quota exceeded
  }
}

function entryKey(e){
  if(!e || typeof e !== "object") return "";
  return `${e.type ?? ""}__${e.timestamp ?? ""}`;
}

function mergeTimelineEntries(existing, incoming, cap = TIMELINE_ROOM_CAP){
  const res = Array.isArray(existing) ? existing.slice() : [];
  if(!Array.isArray(incoming) || !incoming.length){
    return res.length > cap ? res.slice(-cap) : res;
  }
  const seen = new Set(res.map(entryKey));
  for(const e of incoming){
    if(!e || typeof e !== "object") continue;
    const key = entryKey(e);
    if(!seen.has(key)){
      seen.add(key);
      res.push(e);
    }
  }
  return res.length > cap ? res.slice(-cap) : res;
}

function updateAccumulatedTimelines(existingTimelines, rooms, incomingTimelines){
  const result = {};
  if(!Array.isArray(rooms)) return result;
  const existing = (existingTimelines && typeof existingTimelines === "object") ? existingTimelines : {};
  const incoming = (incomingTimelines && typeof incomingTimelines === "object") ? incomingTimelines : {};

  for(const room of rooms){
    if(!room || !room.path) continue;
    const path = room.path;
    const prev = existing[path] || [];
    const inc = incoming[path] || [];
    const merged = mergeTimelineEntries(prev, inc, TIMELINE_ROOM_CAP);
    if(merged.length > 0){
      result[path] = merged;
    }
  }
  return result;
}

// #1613 item 4: stepId/exitCode ride each entry (ids/counts, per the operator's amended content
// ruling) when the underlying event carried one -- absent-safe, same as every other optional field
// on this page: an entry with neither renders exactly as it did pre-#1613.
function timelineEntryDetail(e){
  const bits = [];
  if(e.stepId) bits.push(esc(e.stepId));
  if(e.exitCode != null) bits.push(`exit ${esc(String(e.exitCode))}`);
  return bits.length ? ` (${bits.join(", ")})` : "";
}
function timelineHtml(room, timelines, isOpen = false){
  const entries = timelines && room.path ? timelines[room.path] : null;
  if(!Array.isArray(entries) || !entries.length) return "";
  const rows = entries.map(e => {
    const a = age(e.timestamp);
    const rawType = e.type || "";
    const label = friendlyEventName(rawType);
    return `<div class="tl-entry"><span class="tl-type mono" title="${esc(rawType)}">${esc(label)}${timelineEntryDetail(e)}</span><span class="tl-age">${a ? a + " ago" : ""}</span></div>`;
  }).join("");
  return `<details class="tl-details" data-room-path="${esc(room.path)}"${isOpen ? " open" : ""}><summary>Timeline · ${entries.length}</summary>${rows}</details>`;
}

// -----------------------------------------------------------------------------------------------
// #1532: per-viewer dismiss and terminal collapse. Persisted in localStorage under its own key
// (baton.glass.dismissed), keyed by room PATH (absent-safe, try/catch-wrapped).
// Never silent: dismissed count + state is visible with a restore affordance.
// -----------------------------------------------------------------------------------------------
const DISMISSED_STORAGE_KEY = "baton.glass.dismissed";

function loadPersistedDismissed(){
  try {
    if(typeof localStorage === "undefined" || !localStorage) return new Set();
    const raw = localStorage.getItem(DISMISSED_STORAGE_KEY);
    if(!raw) return new Set();
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? new Set(parsed.filter(p => typeof p === "string" && p)) : new Set();
  } catch(e) {
    return new Set();
  }
}

function savePersistedDismissed(dismissedSet){
  try {
    if(typeof localStorage === "undefined" || !localStorage) return;
    if(!dismissedSet) return;
    const arr = Array.from(dismissedSet);
    localStorage.setItem(DISMISSED_STORAGE_KEY, JSON.stringify(arr));
  } catch(e) {
    // Storage access blocked or quota exceeded
  }
}

function pruneDismissed(dismissedSet, rooms){
  if(!dismissedSet) return new Set();
  const current = dismissedSet instanceof Set ? new Set(dismissedSet) : new Set(Array.isArray(dismissedSet) ? dismissedSet : []);
  if(!Array.isArray(rooms)) return current;
  const presentTerminalPaths = new Set();
  for(const r of rooms){
    if(r && r.path){
      if(r.state === "Running"){
        current.delete(r.path);
      } else {
        presentTerminalPaths.add(r.path);
      }
    }
  }
  for(const p of Array.from(current)){
    if(!presentTerminalPaths.has(p)){
      current.delete(p);
    }
  }
  return current;
}

// -----------------------------------------------------------------------------------------------
// #1505 item 6: copy-the-verb. Never executes anything -- copies a CLI verb string to the
// clipboard for the operator to paste into their own Claude Code mobile session (spec/baton.md
// §10: origination and arrest both stay orchestrator-only). `redispatch` needs only the room
// path; `cancel`'s actual parser (CancelOptionsParser.cs) hard-requires --execution and
// --bindings, so the copied command only appears once a Running step's execution id is known,
// and always carries the full working invocation rather than a bare path that would fail if
// pasted verbatim -- see report-1505.md's labeled deviation note.
// -----------------------------------------------------------------------------------------------
function bindingsPathFor(roomPath){
  const sep = roomPath.includes("\\") && !roomPath.includes("/") ? "\\" : "/";
  return roomPath.replace(/[\\/]+$/, "") + sep + "bindings.json";
}
// The verb is copied to a clipboard and pasted into a real shell, so a `"` in a room path would
// otherwise terminate the quoted argument early and let anything after it execute (PR #1508 review).
// Escaping the quote-closer neutralizes that for both bash and pwsh double-quoted arguments; if a
// path still carries a raw newline (no legal filesystem produces one, but the payload isn't
// path-validated), refuse the button rather than emit a command that could span lines.
function shellArgSafe(s){ return !/[\r\n]/.test(s); }
function shq(s){ return s.replace(/"/g, '\\"'); }
function copyButtonHtml(verb, label){
  return `<button class="copybtn" data-verb="${esc(verb)}">${esc(label)}</button><input class="revealbox mono" readonly hidden>`;
}
// #1659: `baton room delete` copy button, terminal cards only -- a room still Running/Stalled may
// have a live engine holding its files (RoomDeleteCommand's own refusal exists for exactly that), so
// this is offered only where `terminal` is true (Failed/Succeeded/Indeterminate, the states a room's
// terminal.json is actually written for). Dry-run-free (no --force) on purpose: a terminal card is
// already known terminal from the same fleet_status read this page renders from, so the default
// refusal `baton room delete` would hit on a non-terminal room never applies here.
function copyButtonsHtml(room, running, terminal){
  if(!room.path || !shellArgSafe(room.path)) return "";
  const buttons = [copyButtonHtml(`baton redispatch "${shq(room.path)}"`, "copy redispatch")];
  if(room.state === "Running" && running && running.execution){
    const cancelVerb = `baton cancel "${shq(room.path)}" --execution ${running.execution} --bindings "${shq(bindingsPathFor(room.path))}"`;
    buttons.push(copyButtonHtml(cancelVerb, "copy cancel"));
  }
  if(terminal){
    buttons.push(copyButtonHtml(`baton room delete "${shq(room.path)}"`, "copy delete"));
  }
  return `<div class="verbs">${buttons.join("")}</div>`;
}
async function copyToClipboard(text){
  try {
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(text);
      return true;
    }
  } catch(e) { /* fall through to the execCommand fallback */ }
  try {
    const ta = document.createElement("textarea");
    ta.value = text;
    ta.style.position = "fixed"; ta.style.top = "0"; ta.style.left = "0"; ta.style.opacity = "0";
    document.body.appendChild(ta);
    ta.focus(); ta.select();
    const ok = document.execCommand("copy");
    document.body.removeChild(ta);
    return ok;
  } catch(e) {
    return false;
  }
}
document.addEventListener("click", async (ev) => {
  const btn = ev.target.closest(".copybtn");
  if(!btn) return;
  // #1659: the Terminal section's "copy prune" button lives inside <summary> (so it reads as part of
  // the section header) -- without this, a click on it would ALSO fire the native <summary> toggle
  // and collapse/expand the section the operator was not trying to touch.
  ev.preventDefault();
  const verb = btn.dataset.verb;
  const ok = await copyToClipboard(verb);
  const reveal = btn.nextElementSibling;
  if(ok){
    const orig = btn.textContent;
    btn.textContent = "copied";
    setTimeout(() => { btn.textContent = orig; }, 1500);
    if(reveal) reveal.hidden = true;
  } else if(reveal){
    // Sandboxed artifact contexts can deny both clipboard paths -- degrade to a tap-to-reveal,
    // select-all text field rather than silently doing nothing.
    reveal.hidden = false;
    reveal.value = verb;
    reveal.focus(); reveal.select();
  }
});

// -----------------------------------------------------------------------------------------------
// #1613 item 1: live telemetry for a Running room's currently-executing step -- a tool-call COUNT,
// claude-only live token counts (2026-09-01 review), and a last-stream-activity age, all read
// pusher-side straight off the execution's own .stdout.log (no engine change; see pusher.py's own
// "Seam choice" comment). Absent-safe like role/adapter/model/effort above: `room.live` is simply
// never present until the pusher that produced this snapshot has been redeployed for #1613, same
// convention every other optional fleet_status field on this page already follows. The token
// fields are additionally claude-only (agy's step_update carries no usage to read) and further
// gated on the per-message capture shape -- see pusher.py's `extract_live_counts` doc for exactly
// when each is present.
// -----------------------------------------------------------------------------------------------
function liveTelemetryHtml(room){
  const live = room.live;
  if(!live) return "";
  const bits = [];
  if(live.outputTokens != null) bits.push(`out ${fmtK(live.outputTokens)}`);
  if(live.contextTokens != null) bits.push(`ctx ${fmtK(live.contextTokens)}`);
  if(live.toolCalls != null) bits.push(`${live.toolCalls} call${live.toolCalls === 1 ? "" : "s"}`);
  const a = age(live.lastActivityAt);
  if(a) bits.push(`active ${a} ago`);
  return bits.length ? `<div class="ev mono">${bits.join(" · ")}</div>` : "";
}
function laneHtml(room, timelines, dismissable = false, openTimelines = null, terminal = false){
  const running = (room.steps||[]).find(s => s.state === "Running");
  const lastStep = (room.steps||[])[ (room.steps||[]).length - 1 ];
  // Chips key off the step that actually failed, not array position: in A->B->C with B
  // Permanent-failed and C still Pending, lastStep is C (carries no attempt/failureKind) and
  // neither chip would render even though B holds the data. Simultaneous Failed steps
  // (parallel branches) pick the first one in definition order -- an accepted heuristic.
  const failedStep = (room.steps||[]).find(s => s.state === "Failed");
  const focusStep = running || failedStep || lastStep;
  const bits = [];
  if(running){
    bits.push("step: " + esc(running.id));
    if(running.liveness === "unknown") bits.push("engine: unknown");
  }
  else if(lastStep) bits.push(esc(lastStep.id) + " " + esc(lastStep.state));
  const u = lastStep && (lastStep.usage || lastStep.linkedFromUsage);
  const tk = tokens(u); if(tk) bits.push(tk);
  const wc = u && dur(u.wallClockMs); if(wc) bits.push(wc);
  const err = room.error ? `<div class="ev" title="${esc(room.error)}">⛔ ${esc(room.error.slice(0,110))}</div>` : "";
  const tryLine = room.try ? `<div class="ev" title="${esc(room.try)}">↻ suggested: ${esc(room.try.slice(0,110))}</div>` : "";
  const t = newestStepTime(room);
  const a = age(t);
  // #1656 / #1549: a healthy lane can run 30+ minutes between journal events (a long tool call),
  // so keying the stale ⚠ on journal-event age alone false-fires on every live lane whose journal
  // just happens to be quiet. `room.live.lastActivityAt` (pusher.py's own .stdout.log mtime probe,
  // present whenever a Running room's execution has captured output) is the honest signal when it
  // exists -- fall back to the journal-event age (`t`) only for a Running room `live` was never
  // attached to (dispatch just started, or the pusher hasn't been redeployed for #1613 item 1 yet).
  const liveActivityAt = room.live && room.live.lastActivityAt;
  const stalenessBasis = liveActivityAt || t;
  const isStale = room.state === "Running" && stalenessBasis && (Date.now() - Date.parse(stalenessBasis)) > 15 * 60000;
  const ageLine = a ? `<div class="age">last event ${a} ago${isStale ? " ⚠" : ""}</div>` : "";
  const roomDeliverablesKey = room.path || room.name;
  const deliverables = roomDeliverablesKey
    ? `<div class="deliverables"><a class="inboxlink" data-room="${esc(roomDeliverablesKey)}">deliverables &rarr;</a></div>` : "";
  // #1499: a --label makes the room title the human-legible name (e.g. "the #1496 env-snapshot
  // lane") instead of its bare dispatch-<role>-<hex8> directory name; the room name never disappears
  // -- it drops to a secondary line so deliverables/redispatch/cancel still show what to paste.
  const title = room.label ? esc(room.label) : esc(room.name);
  const roomIdLine = room.label ? `<div class="roomid">${esc(room.name)}</div>` : "";
  const dismissBtn = (dismissable && room.path)
    ? `<button class="dismissbtn" data-path="${esc(room.path)}" title="Dismiss room" aria-label="Dismiss">×</button>`
    : "";
  const isTlOpen = !!(openTimelines && room.path && openTimelines.has(room.path));
  return `<div class="lane"><div class="top"><span class="name">${title}</span><span class="chips">${chipsHtml(room, running, focusStep)}${dismissBtn}</span></div>
    ${roomIdLine}
    ${projectLineHtml(room)}
    ${bindingLineHtml(room)}
    ${bits.length ? `<div class="ev">${bits.join(" · ")}</div>` : ""}${tryLine}${err}${ageLine}
    ${liveTelemetryHtml(room)}
    ${timelineHtml(room, timelines, isTlOpen)}
    ${copyButtonsHtml(room, running, terminal)}
    ${deliverables}</div>`;
}
// -----------------------------------------------------------------------------------------------
// #1619 (rung 1 of #1614's ruling): group a state bucket's lanes by --workstream before rendering.
// Rooms without the field render exactly as before this feature -- flat, no heading, same fail-open
// contract projectLineHtml/bindingLineHtml already follow for their own absent-safe fields.
// -----------------------------------------------------------------------------------------------
function groupLanesHtml(rooms, timelines, dismissable, openTimelines, terminal = false){
  if(!rooms.length) return `<div class="lane"><div class="ev">none</div></div>`;
  const groups = new Map();
  const ungrouped = [];
  for(const r of rooms){
    if(r && r.workstream){
      if(!groups.has(r.workstream)) groups.set(r.workstream, []);
      groups.get(r.workstream).push(r);
    } else {
      ungrouped.push(r);
    }
  }
  if(groups.size === 0){
    return rooms.map(r => laneHtml(r, timelines, dismissable, openTimelines, terminal)).join("");
  }
  let html = "";
  for(const [slug, groupRooms] of Array.from(groups.entries()).sort((a,b) => a[0].localeCompare(b[0]))){
    html += `<div class="workstream-group"><h3 class="workstream-heading">${esc(slug)} · ${groupRooms.length}</h3><div class="lanes">`
      + groupRooms.map(r => laneHtml(r, timelines, dismissable, openTimelines, terminal)).join("") + `</div></div>`;
  }
  if(ungrouped.length){
    html += ungrouped.map(r => laneHtml(r, timelines, dismissable, openTimelines, terminal)).join("");
  }
  return html;
}
function underhoodHtml(list){
  if(!Array.isArray(list) || !list.length) return "";
  const rows = list.map(w => {
    const commitAge = w.last_commit_at ? age(w.last_commit_at) : null;
    const bits = [];
    if(w.branch) bits.push(`<span class="mono">${esc(w.branch)}</span>`);
    if(w.uncommitted) bits.push(esc(w.uncommitted));
    const commit = w.last_commit ? `<div class="ev">last commit: ${esc(w.last_commit)}${commitAge ? ` · ${esc(commitAge)} ago` : ""}</div>` : "";
    return `<div class="lane"><div class="top"><span class="name">${esc(w.name)}</span></div>
      <div class="ev">${bits.join(" · ")}</div>${commit}</div>`;
  }).join("");
  return `<h2>Under the hood · ${list.length}</h2><div class="lanes">` + rows + `</div>`;
}
function conductorHtml(conductor, inbox = inboxIndex){
  if(!conductor || !conductor.artifacts_path) return "";
  const conductorRoomPath = conductor.path || conductor.artifacts_path.replace(/[\\/]artifacts[\\/]conductor[\\/]?$/, "");
  const copyBtn = copyButtonHtml(conductor.artifacts_path, "copy path");
  const items = Array.isArray(inbox) ? inbox.filter(m => m && (m.kind === "conductor" || (conductorRoomPath && m.room === conductorRoomPath))) : null;
  const countLine = items !== null ? `<div class="ev">${items.length} deliverable${items.length === 1 ? "" : "s"}</div>` : "";
  const deliverables = conductorRoomPath
    ? `<div class="deliverables"><a class="inboxlink" data-room="${esc(conductorRoomPath)}">deliverables &rarr;</a></div>`
    : "";
  return `<h2>Conductor</h2><div class="lanes"><div class="lane">
    <div class="top"><span class="name">conductor</span><span class="chips"><span class="chip c-ok">STANDBY</span></span></div>
    <div class="ev mono" title="${esc(conductor.artifacts_path)}">${esc(conductor.artifacts_path)}</div>
    ${countLine}
    <div class="verbs">${copyBtn}</div>
    ${deliverables}
  </div></div>`;
}
function formatDismissedNote(totalDismissed, failedCount, stalledCount, doneCount){
  if(totalDismissed <= 0) return "";
  const parts = [];
  if(failedCount > 0){
    parts.push(failedCount === 1 && totalDismissed > 1 ? "1 of them Failed" : failedCount === 1 && totalDismissed === 1 ? "1 of them Failed" : `${failedCount} Failed`);
  }
  if(stalledCount > 0){
    parts.push(stalledCount === 1 && totalDismissed > 1 && failedCount === 0 ? "1 of them Stalled" : stalledCount === 1 && totalDismissed === 1 ? "1 of them Stalled" : `${stalledCount} Stalled`);
  }
  const detail = parts.join(", ");
  const countLabel = totalDismissed === 1 ? "1 hidden" : `${totalDismissed} hidden`;
  return `${countLabel}${detail ? ` · ${detail}` : ""} · <a id="restore-dismissed">restore</a>`;
}
function render(rooms, pushedAt, underhood, heartbeatAt, timelines, staleHiddenCount, dismissed = dismissedRooms, conductor = lastGood && lastGood.conductor){
  const openTimelinePaths = new Set();
  if(typeof document !== "undefined"){
    for(const el of document.querySelectorAll("#content details.tl-details[open]")){
      if(el.dataset.roomPath) openTimelinePaths.add(el.dataset.roomPath);
    }
  }

  const running = rooms.filter(r => r.state === "Running");
  // #1582: a Stalled room -- a retry scheduled inside a process that no longer exists -- gets its
  // own bucket rather than falling into Running (wrong: nothing is happening) or the generic
  // exact-match buckets below (which would drop it off the page entirely, since "Stalled" matches
  // none of them and is truthy so it also misses the `other` catch-all).
  const stalled = rooms.filter(r => r.state === "Stalled");
  // #1586 S1: same hole Stalled itself closed pre-#1582 -- a truthy, unrecognized state string
  // matches none of the exact-match buckets below AND isn't `!r.state`, so without its own bucket
  // it would vanish off the page entirely rather than surface anywhere. Producer since #1608.
  const indeterminate = rooms.filter(r => r.state === "Indeterminate");
  const failed  = rooms.filter(r => r.state === "Failed");
  const done    = rooms.filter(r => r.state === "Succeeded");
  const other   = rooms.filter(r => !r.state);
  // #1656: fold in whatever terminal-archive pages the operator has already loaded via "load
  // older" -- deduped against the hot set by path, since fleet_status's `page=0` deliberately
  // returns the same newest terminal rooms the hot set already carries (split_hot_and_archive's own
  // doc: the archive is the full population, not just the tail beyond the cap).
  if(terminalArchiveExtra.length){
    const seenPaths = new Set(failed.concat(done).map(r => r.path));
    for(const r of terminalArchiveExtra){
      if(!r || !r.path || seenPaths.has(r.path)) continue;
      seenPaths.add(r.path);
      (r.state === "Failed" ? failed : r.state === "Succeeded" ? done : other).push(r);
    }
  }
  const byNewest = (a,b) => (newestStepTime(b)||"").localeCompare(newestStepTime(a)||"");
  running.sort(byNewest); stalled.sort(byNewest); indeterminate.sort(byNewest); failed.sort(byNewest); done.sort(byNewest);

  const dismissedSet = dismissed instanceof Set ? dismissed : new Set(Array.isArray(dismissed) ? dismissed : []);
  const isDismissed = (r) => r && r.path && dismissedSet.has(r.path);

  const dismissedStalled = stalled.filter(isDismissed);
  const visibleStalled = stalled.filter(r => !isDismissed(r));
  const dismissedFailed = failed.filter(isDismissed);
  const visibleFailed = failed.filter(r => !isDismissed(r));
  const dismissedDone = done.filter(isDismissed);
  const visibleDone = done.filter(r => !isDismissed(r));

  const totalDismissed = dismissedFailed.length + dismissedDone.length + dismissedStalled.length;

  let html = underhoodHtml(underhood);
  html += conductorHtml(conductor);
  html += `<h2>Running · ${running.length}</h2><div class="lanes">` + groupLanesHtml(running, timelines, false, openTimelinePaths) + `</div>`;
  // Ranked above Failed and kept out of the collapsible Terminal section (unlike Failed/Succeeded):
  // a stalled room isn't finished, and nothing but a person will ever move it, so it stays as
  // visible as Running rather than one click away.
  const stalledDismissAll = visibleStalled.length > 0 ? `<a class="dismissall" data-section="stalled">dismiss all</a>` : "";
  html += `<h2><span>Stalled · ${visibleStalled.length}</span>${stalledDismissAll}</h2><div class="lanes">` + groupLanesHtml(visibleStalled, timelines, true, openTimelinePaths) + `</div>`;
  // Same placement reasoning as Stalled above: an Indeterminate room isn't finished either -- it
  // needs a conductor's recorded resolution, never a silent default -- so it stays out of the
  // collapsible Terminal section too, as visible as Running/Stalled rather than one click away.
  html += `<h2>Indeterminate · ${indeterminate.length}</h2><div class="lanes">` + groupLanesHtml(indeterminate, timelines, false, openTimelinePaths) + `</div>`;

  const termParts = [];
  if(visibleDone.length > 0 || visibleFailed.length === 0){
    termParts.push(`${visibleDone.length} succeeded`);
  }
  if(visibleFailed.length > 0){
    termParts.push(`${visibleFailed.length} failed`);
  }
  const termSummary = termParts.join(" · ");

  let termContent = "";
  if(visibleFailed.length > 0){
    const failedDismissAll = `<a class="dismissall" data-section="failed">dismiss all</a>`;
    // #1656: no more client-side `.slice(0,12)` -- the byte budget that cap used to protect is now
    // enforced upstream (pusher.py's hot-set cap + fleet_status's page/limit), so every terminal
    // room actually delivered to this view is worth rendering.
    termContent += `<h2><span>Failed · ${visibleFailed.length}</span>${failedDismissAll}</h2><div class="lanes">` + groupLanesHtml(visibleFailed, timelines, true, openTimelinePaths, true) + `</div>`;
  }
  if(visibleDone.length > 0){
    const doneDismissAll = `<a class="dismissall" data-section="succeeded">dismiss all</a>`;
    termContent += `<h2><span>Succeeded · ${visibleDone.length}</span>${doneDismissAll}</h2><div class="lanes">` + groupLanesHtml(visibleDone, timelines, true, openTimelinePaths, true) + `</div>`;
  }
  if(!visibleFailed.length && !visibleDone.length){
    termContent += `<div class="lanes"><div class="lane"><div class="ev">none</div></div></div>`;
  }
  // #1656: terminalTotal (server's count of ALL terminal rooms) vs. failed.length+done.length
  // (everything actually loaded so far, hot set + any "load older" pages) -- offer the link only
  // while there is provably more archive left to fetch.
  const loadedTerminalCount = failed.length + done.length;
  if(terminalTotal != null && loadedTerminalCount < terminalTotal && terminalNextPage != null){
    termContent += `<div class="lanes"><a id="load-more-terminal" class="loadmore">load older (${terminalTotal - loadedTerminalCount} more)</a></div>`;
  }

  // Preserve the section's open/closed state across a re-render -- otherwise every dismiss/restore
  // click (which rebuilds #content from scratch) would slam an opened Terminal section shut again.
  const terminalWasOpen = !!($("terminal-details") && $("terminal-details").open);
  // #1659: "copy prune" in the section header -- the batch form of the per-card "copy delete" button
  // above. Copies the dry-run form (no --yes): the operator reviews what would be removed before
  // opting into the destructive form themselves, same "copy text, never execute" contract every
  // other button on this page follows (spec/baton.md §10: origination and arrest stay
  // orchestrator-only). document's click handler stops this from also toggling the <details> open/
  // closed, since a native <summary> click otherwise fires on any element inside it.
  const pruneCopyBtn = copyButtonHtml("baton rooms prune --terminal", "copy prune");
  html += `<details id="terminal-details"${terminalWasOpen ? " open" : ""}><summary>Terminal · ${termSummary} ${pruneCopyBtn}</summary>${termContent}</details>`;
  const unreadableWasOpen = !!($("unreadable-details") && $("unreadable-details").open);
  if(other.length) html += `<details id="unreadable-details"${unreadableWasOpen ? " open" : ""}><summary>Unreadable entries · ${other.length}</summary><div class="lanes">${other.slice(0,20).map(r => laneHtml(r, timelines, false, openTimelinePaths)).join("")}</div></details>`;
  $("content").innerHTML = html;
  $("fresh").textContent = freshLabel(pushedAt, "pushed ") || "push time unknown";
  const hb = freshLabel(heartbeatAt, "pusher alive ");
  if(hb) $("fresh").textContent += " · " + hb;
  // #1505 landmine #43: a stale-room drop is now a visible count, never silence.
  $("stalenote").textContent = staleHiddenCount
    ? `${staleHiddenCount} room(s) hidden — older than the pusher's retention window`
    : "";

  const dismissNoteEl = $("dismissnote");
  if(dismissNoteEl){
    dismissNoteEl.innerHTML = formatDismissedNote(totalDismissed, dismissedFailed.length, dismissedStalled.length, dismissedDone.length);
  }
}
// "pushed X ago" measures the SNAPSHOT (legitimately stale on a quiet fleet, #1457's change-gate);
// "pusher alive X ago" measures the PUSHER PROCESS itself (hourly heartbeat, #1486) -- the two are
// deliberately independent so a quiet fleet with an old snapshot still reads as healthy.
function freshLabel(iso, prefix){
  if(!iso) return null;
  const a = age(iso);
  return prefix + (a || new Date(iso).toLocaleTimeString()) + (a && a !== "just now" ? " ago" : "");
}
function banner(html){ $("banner").innerHTML = html ? `<div class="banner">${html}</div>` : ""; }

// #1656: on-demand paging over the terminal archive (see terminalArchiveExtra's own comment at its
// declaration). One-shot fetch on click -- `refetchInterval: 0` means this watchTool call does not
// join the periodic 30s poll the main fleet_status subscription already runs; it settles once and
// the callback re-renders from the (module-level) accumulated state.
function loadMoreTerminal(){
  if(!window.mcpHandle || terminalNextPage == null) return;
  window.mcpHandle.watchTool("baton", "fleet_status", { page: terminalNextPage, limit: 50 }, (ev) => {
    if(ev.type !== "data") return;
    let payload = ev.result.payload;
    if(typeof payload === "string"){ try { payload = JSON.parse(payload); } catch { payload = null; } }
    if(!payload || !Array.isArray(payload.rooms)) return;
    const known = new Set(terminalArchiveExtra.map(r => r && r.path));
    for(const r of payload.rooms){
      if(r && r.path && !known.has(r.path)){ terminalArchiveExtra.push(r); known.add(r.path); }
    }
    if(typeof payload.terminal_total === "number") terminalTotal = payload.terminal_total;
    terminalNextPage = typeof payload.next_page === "number" ? payload.next_page : null;
    if(lastGood){
      render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms);
    }
  }, { refetchInterval: 0 });
}

// -----------------------------------------------------------------------------------------------
// Deliverables inbox (#1413, merged into this artifact as a tab by #1505 item 4). Same data
// contract as the deleted inbox.html: deliverables_list({room?}) -> {items, count},
// deliverable_read({id}) -> full text. Markdown rendering stays DELIBERATELY MINIMAL (headings,
// code fences, bold/italic, links, bullet lists, paragraphs) -- enough for this pipeline's own
// report markdown, not a general CommonMark implementation. Everything is HTML-escaped before any
// markup is applied.
// -----------------------------------------------------------------------------------------------
function verdictChip(v){
  const state = typeof v === "string" ? v : (v && v.state);
  if(!state) return ["?","c-idle"];
  const upper = state.toUpperCase();
  if(upper === "SUCCEEDED" || upper === "OK" || upper === "APPROVE" || upper === "APPROVED" || upper === "PASS" || upper === "PASSED") return [typeof v === "string" ? upper : "OK", "c-ok"];
  if(upper === "FAILED" || upper === "REQUEST-CHANGES" || upper === "REQUEST_CHANGES" || upper === "FAIL" || upper === "REJECT" || upper === "REJECTED") return [typeof v === "string" ? upper : "FAILED", "c-bad"];
  if(upper === "WARN" || upper === "WARNING") return [upper, "c-warn"];
  return [upper, "c-idle"];
}
function findingSeverityChip(sev){
  if(!sev) return null;
  const s = String(sev).toLowerCase();
  if(s === "high" || s === "critical" || s === "error") return [s.toUpperCase(), "c-bad"];
  if(s === "medium" || s === "med" || s === "warn" || s === "warning") return [s.toUpperCase(), "c-warn"];
  if(s === "low" || s === "info") return [s.toUpperCase(), "c-idle"];
  return [s.toUpperCase(), "c-idle"];
}
function findingStatusChip(st){
  if(!st) return null;
  const s = String(st).toLowerCase();
  if(s === "confirmed") return [s.toUpperCase(), "c-ok"];
  if(s === "refuted") return [s.toUpperCase(), "c-idle"];
  if(s === "unverified") return [s.toUpperCase(), "c-warn"];
  return [s.toUpperCase(), "c-idle"];
}
function findingHtml(f){
  if(!f || typeof f !== "object") return `<div class="finding"><div class="finding-claim">${esc(String(f))}</div></div>`;
  const claim = f.claim || f.title || "";
  const chips = [];
  const sev = findingSeverityChip(f.severity);
  if(sev) chips.push(`<span class="chip ${sev[1]}">${esc(sev[0])}</span>`);
  const st = findingStatusChip(f.status);
  if(st) chips.push(`<span class="chip ${st[1]}">${esc(st[0])}</span>`);

  let anchor = "";
  if(f.anchor){
    if(typeof f.anchor === "object"){
      const file = f.anchor.file || "";
      const line = f.anchor.line != null ? `:${f.anchor.line}` : "";
      if(file) anchor = `<div class="finding-anchor mono">${esc(file + line)}</div>`;
    } else if(typeof f.anchor === "string"){
      anchor = `<div class="finding-anchor mono">${esc(f.anchor)}</div>`;
    }
  }
  const detail = f.detail || f.body || "";
  // Review lanes author markdown in detail/body (#1543) -- render it (renderMarkdown escapes
  // internally) instead of showing literal ## headings and hard-wrapped source lines.
  const detailHtml = detail ? `<div class="finding-detail">${renderMarkdown(detail)}</div>` : "";
  return `<div class="finding">
    <div class="finding-top">
      <span class="finding-claim">${esc(claim || "Finding")}</span>
      ${chips.length ? `<span class="finding-chips">${chips.join("")}</span>` : ""}
    </div>
    ${anchor}
    ${detailHtml}
  </div>`;
}
function formatMetaValue(val){
  if(val == null) return "—";
  // Multiline string values (e.g. a verdict's summary) are markdown-authored prose (#1543);
  // single-line values stay plain escaped text.
  if(typeof val === "string") return /\n/.test(val) ? renderMarkdown(val) : esc(val);
  if(typeof val === "number" || typeof val === "boolean") return esc(String(val));
  return `<pre><code>${esc(JSON.stringify(val, null, 2))}</code></pre>`;
}
function renderVerdictDoc(data){
  const dts = [];
  for(const k of Object.keys(data)){
    if(k === "findings" || k === "verdict") continue;
    dts.push(`<dt>${esc(k)}</dt><dd>${formatMetaValue(data[k])}</dd>`);
  }
  const metaHtml = dts.length ? `<dl>${dts.join("")}</dl>` : "";
  let findingsHtml = "";
  if(Array.isArray(data.findings)){
    const items = data.findings.map(findingHtml).join("");
    findingsHtml = `<h3>Findings · ${data.findings.length}</h3>` + (items || `<div class="empty">No findings recorded.</div>`);
  }
  return metaHtml + findingsHtml;
}
function renderMarkdown(text){
  // Windows lanes write CRLF deliverables (#1545); a trailing \r defeats the heading/bullet
  // regexes' (.*)$ anchors (JS "." never matches \r), so normalize before splitting.
  const lines = esc(text ?? "").replace(/\r\n?/g, "\n").split("\n");
  let html = "";
  let inCode = false, inList = null;
  let para = [], table = [], bq = [];
  const flushPara = () => {
    if(para.length){
      html += `<p>${inline(para.join(" "))}</p>`;
      para = [];
    }
  };
  const flushList = () => {
    if(inList === "ul"){ html += "</ul>"; inList = null; }
    else if(inList === "ol"){ html += "</ol>"; inList = null; }
  };
  const flushBq = () => {
    if(bq.length){
      html += `<blockquote><p>${inline(bq.join(" "))}</p></blockquote>`;
      bq = [];
    }
  };
  const parseCells = (line) => {
    const clean = line.trim().replace(/^\|/, "").replace(/\|$/, "");
    const protectedLine = clean.replace(/\\\|/g, "\u0000");
    return protectedLine.split("|").map(c => c.replace(/\u0000/g, "|").trim());
  };
  const isSeparatorRow = (line) => {
    const cells = parseCells(line);
    return cells.length > 0 && cells.every(c => /^:?-+:?$/.test(c));
  };
  const flushTable = () => {
    if(!table.length) return;
    if(table.length >= 2 && isSeparatorRow(table[1])){
      const headers = parseCells(table[0]);
      const rows = table.slice(2).map(parseCells);
      let tHtml = '<div class="table-wrap"><table><thead><tr>';
      tHtml += headers.map(h => `<th>${inline(h)}</th>`).join("");
      tHtml += '</tr></thead><tbody>';
      for(const row of rows){
        tHtml += '<tr>';
        tHtml += row.map(c => `<td>${inline(c)}</td>`).join("");
        tHtml += '</tr>';
      }
      tHtml += '</tbody></table></div>';
      html += tHtml;
    } else {
      html += `<pre><code>${table.join("\n")}</code></pre>`;
    }
    table = [];
  };
  const inline = (s) => s
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
    .replace(/\*([^*]+)\*/g, "<i>$1</i>")
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g, (m, t, u) => /^https?:\/\//.test(u) ? `<a href="${u}" target="_blank" rel="noopener">${t}</a>` : m);
  for(const raw of lines){
    if(raw.trim().startsWith("```")){
      flushPara();
      flushTable();
      flushBq();
      flushList();
      html += inCode ? "</code></pre>" : "<pre><code>";
      inCode = !inCode;
      continue;
    }
    if(inCode){ html += raw + "\n"; continue; }
    const heading = raw.match(/^(#{1,6})\s+(.*)$/);
    if(heading){
      flushPara();
      flushTable();
      flushBq();
      flushList();
      const level = heading[1].length;
      html += `<h${level}>${inline(heading[2])}</h${level}>`;
      continue;
    }
    if(/^(\s*[-*_]\s*){3,}$/.test(raw)){
      flushPara();
      flushTable();
      flushBq();
      flushList();
      html += "<hr>";
      continue;
    }
    const bqMatch = raw.match(/^\s*(?:>|&gt;)\s?(.*)$/);
    if(bqMatch){
      flushPara();
      flushTable();
      flushList();
      bq.push(bqMatch[1]);
      continue;
    }
    flushBq();
    const bullet = raw.match(/^\s*[-*]\s+(.*)$/);
    if(bullet){
      flushPara();
      flushTable();
      if(inList !== "ul"){
        flushList();
        html += "<ul>";
        inList = "ul";
      }
      html += `<li>${inline(bullet[1])}</li>`;
      continue;
    }
    const numMatch = raw.match(/^\s*\d+\.\s+(.*)$/);
    if(numMatch){
      flushPara();
      flushTable();
      if(inList !== "ol"){
        flushList();
        html += "<ol>";
        inList = "ol";
      }
      html += `<li>${inline(numMatch[1])}</li>`;
      continue;
    }
    if(raw.trim() === ""){
      flushPara();
      flushTable();
      flushList();
      continue;
    }
    if(/^\s*\|/.test(raw)){
      flushPara();
      flushList();
      table.push(raw);
      continue;
    }
    flushTable();
    flushList();
    para.push(raw.trim());
  }
  flushPara();
  flushTable();
  flushBq();
  flushList();
  if(inCode) html += "</code></pre>";
  return html;
}
function itemRow(item){
  const isConductor = item.kind === "conductor";
  const [label, cls] = isConductor ? ["CONDUCTOR", "c-run"] : verdictChip(item.verdict);
  const a = age(item.created_at || item.pushed_at);
  const withheld = item.withheld ? ` · <span title="${esc(item.stub_reason || "")}">withheld</span>` : "";
  const roomLabel = item.room_name || item.room;
  return `<div class="item" data-id="${esc(item.id)}">
    <div class="top"><span class="title">${esc(item.title || item.artifact || item.id)}</span><span class="chip ${cls}">${label}</span></div>
    <div class="meta">${esc(roomLabel)}${item.artifact ? " · " + esc(item.artifact) : ""} · ${a ? a + " ago" : "?"}${withheld}</div>
  </div>`;
}
function renderInboxList(items, roomFilter, count){
  let filterLabel = roomFilter;

    const match = (items.length > 0 ? items : inboxIndex).find(m => m.room === roomFilter && m.room_name);
    if(match) filterLabel = match.room_name;
  }
  $("filter").innerHTML = roomFilter
    ? `filtered to room <b>${esc(filterLabel)}</b> · <a id="clearfilter">clear</a>`
    : "";

  if(clear) clear.addEventListener("click", () => { inboxRoomFilter = ""; location.hash = "#inbox"; applyRoute(); });
  const list = items.length
    ? items.map(itemRow).join("")
    : `<div class="empty">No deliverables ${roomFilter ? "for this room " : ""}yet.</div>`;
  // #1656 F1: "showing N of count" plus a load-more control mirroring loadMoreTerminal() above --
  // never silently truncate to the first page. `count` is null only before the first page for the
  // current filter has come back (fetchInboxPage's one-shot fetch); the summary line waits for it.
  const summary = count != null
    ? `<div class="lanes">showing ${items.length} of ${count}`
      + (inboxNextCursor != null ? ` · <a id="load-more-inbox" class="loadmore">load more</a>` : "")
      + `</div>`
    : "";
  $("inboxcontent").innerHTML = list + summary;

}
function renderInboxDoc(item, text){
  let parsed = null;
  if(typeof text === "string" && text.trim()){
    try { parsed = JSON.parse(text); } catch { parsed = null; }
  }
  const isVerdictShaped = parsed && typeof parsed === "object" && !Array.isArray(parsed) && (
    Array.isArray(parsed.findings) || typeof parsed.verdict === "string"
  );
  const isConductor = item && item.kind === "conductor";
  const verdictForChip = (isVerdictShaped && typeof parsed.verdict === "string") ? parsed.verdict : (item && item.verdict);
  const [label, cls] = isConductor ? ["CONDUCTOR", "c-run"] : verdictChip(verdictForChip);
  const verdict = isConductor ? null : (item && item.verdict);
  const verdictLine = verdict
    ? `<div class="meta">${esc(verdict.state || "?")}${verdict.error ? " — " + esc(verdict.error) : ""}${verdict.try ? " (" + esc(verdict.try) + ")" : ""}</div>`
    : "";

  let docHtml = "";
  if(isVerdictShaped){
    docHtml = renderVerdictDoc(parsed);
  } else if(parsed !== null){
    docHtml = `<pre><code>${esc(JSON.stringify(parsed, null, 2))}</code></pre>`;
  } else {
    docHtml = renderMarkdown(text);
  }

  $("inboxcontent").innerHTML = `
    <a class="back" id="inboxback">&larr; back to inbox</a>
    <h2>${esc((item && (item.title || item.artifact)) || "")} <span class="chip ${cls}">${label}</span></h2>
    ${verdictLine}
    <div class="doc">${docHtml}</div>`;
  $("inboxback").addEventListener("click", () => { location.hash = "#inbox"; });
}

// -----------------------------------------------------------------------------------------------
// Tabs + hash routing. "" = Fleet; "#inbox" = inbox list; "#inbox:<id>" = one inbox item. Clicking
// a room's "deliverables →" link sets the in-memory room filter and switches tabs client-side --
// no navigation, since this is one page now (#1505 item 4).
// -----------------------------------------------------------------------------------------------
let inboxRoomFilter = new URLSearchParams(location.search).get("room") || "";
let inboxIndex = [];
// #1656 F1: on-demand paging over the inbox, mirroring terminalArchiveExtra/terminalNextPage/
// terminalTotal below. inboxExtra/inboxCount/inboxNextCursor are (re)populated by fetchInboxPage
// whenever the active filter changes (including landing on the unfiltered view) or "load more" is
// clicked; inboxLoadedFilter records which filter they currently answer for, so switching rooms

let inboxExtra = [];
let inboxCount = null;
let inboxNextCursor = null;

// scoped by an opaque cursor from a prior call's next_cursor. `replace` is true for the first page
// of a (re)started filter -- overwrites inboxExtra outright rather than appending, since a filter
// switch must not mix pages fetched under the OLD filter into the new one's count/items.
function fetchInboxPage(room, cursor, replace){
  if(!window.mcpHandle) return;
  const args = { limit: 50 };
  if(room) args.room = room;
  if(cursor) args.cursor = cursor;
  window.mcpHandle.watchTool("baton", "deliverables_list", args, (ev) => {
    if(ev.type !== "data") return;
    let payload = ev.result.payload;
    if(typeof payload === "string"){ try { payload = JSON.parse(payload); } catch { payload = null; } }
    if(!payload || !Array.isArray(payload.items)) return;
    if(replace){
      inboxExtra = payload.items;
    } else {
      const known = new Set(inboxExtra.map(m => m && m.id));
      for(const it of payload.items){ if(it && it.id && !known.has(it.id)){ inboxExtra.push(it); known.add(it.id); } }
    }
    if(typeof payload.count === "number") inboxCount = payload.count;
    inboxNextCursor = payload.next_cursor || null;
    if(!location.hash.startsWith("#inbox:")) applyRoute();
  }, { refetchInterval: 0 });
}
function loadMoreInbox(){
  if(inboxNextCursor == null) return;
  fetchInboxPage(inboxRoomFilter, inboxNextCursor, false);
}
function applyRoute(){
  const h = location.hash;
  const onInbox = h === "#inbox" || h.startsWith("#inbox:");
  $("tab-fleet").classList.toggle("active", !onInbox);
  $("tab-inbox").classList.toggle("active", onInbox);
  $("tab-btn-fleet").classList.toggle("active", !onInbox);
  $("tab-btn-inbox").classList.toggle("active", onInbox);
  if(window.getSelection) { try { window.getSelection().removeAllRanges(); } catch(e){} }
  if(!onInbox) return;
  if(h.startsWith("#inbox:")){
    const id = decodeURIComponent(h.slice(7));
    const item = inboxIndex.find((m) => m.id === id) || { id };
    if(!window.mcpHandle) return;
    window.mcpHandle.watchTool("baton", "deliverable_read", { id }, (ev) => {
      if(ev.type === "data"){
        let text = ev.result.payload;
        if(typeof text !== "string") text = JSON.stringify(text);
        renderInboxDoc(item, text);
      }
    }, { refetchInterval: 0 });
  } else {
    // #1656 F1: a room filter pages the same way the unfiltered view does -- a fresh, server-side
    // room-scoped fetch on every filter switch, never a client-side .filter() of the unfiltered
    // top page (which would silently miss older items for that room, past whatever the unfiltered
    // page happened to carry).
    if(inboxLoadedFilter !== inboxRoomFilter){
      inboxExtra = [];
      inboxNextCursor = null;
      inboxCount = null;
      inboxLoadedFilter = inboxRoomFilter;
      fetchInboxPage(inboxRoomFilter, null, true);
    }
    const base = inboxRoomFilter ? [] : inboxIndex;
    const knownIds = new Set(base.map(m => m && m.id));
    const items = base.concat(inboxExtra.filter(m => m && !knownIds.has(m.id)));
    renderInboxList(items, inboxRoomFilter, inboxCount);
  }
}
let lastGood = null;
let accumulatedTimelines = loadPersistedTimelines();
let dismissedRooms = loadPersistedDismissed();
// #1656: the pushed snapshot's `rooms` only carries non-terminal rooms plus the newest
// HOT_TERMINAL_CAP (pusher.py) terminal ones -- everything older lives server-side in
// worker.js's "terminal_archive" key and is fetched a page at a time via fleet_status's own
// `page`/`limit` arguments (never a second tool -- FleetGlassReadOnlyTests pins the TOOLS array to
// exactly fleet_status/deliverables_list/deliverable_read). `terminalArchiveExtra` accumulates
// pages the operator has actually asked for by clicking "load older"; `terminalTotal` is the
// server's count of ALL terminal rooms, used only to decide whether the link still has more to
// offer; `terminalNextPage` is `null` once the archive is exhausted.
let terminalArchiveExtra = [];
let terminalTotal = null;
let terminalNextPage = 0;

document.addEventListener("click", (ev) => {
  const loadMoreBtn = ev.target.closest("#load-more-terminal");
  if(loadMoreBtn){
    loadMoreTerminal();
    return;
  }
  const loadMoreInboxBtn = ev.target.closest("#load-more-inbox");
  if(loadMoreInboxBtn){
    loadMoreInbox();
    return;
  }
  const dismissBtn = ev.target.closest(".dismissbtn");
  if(dismissBtn){
    const path = dismissBtn.dataset.path;
    if(path){
      dismissedRooms.add(path);
      savePersistedDismissed(dismissedRooms);
      if(lastGood && Array.isArray(lastGood.rooms)){
        render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms);
      }
    }
    return;
  }
  const dismissAllBtn = ev.target.closest(".dismissall");
  if(dismissAllBtn){
    const section = dismissAllBtn.dataset.section;
    if(lastGood && Array.isArray(lastGood.rooms)){
      const targetState = section === "failed" ? "Failed" : section === "succeeded" ? "Succeeded" : section === "stalled" ? "Stalled" : null;
      if(targetState){
        for(const r of lastGood.rooms){
          if(r && r.path && r.state === targetState){
            dismissedRooms.add(r.path);
          }
        }
        savePersistedDismissed(dismissedRooms);
        render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms);
      }
    }
    return;
  }
  const restoreBtn = ev.target.closest("#restore-dismissed");
  if(restoreBtn){
    dismissedRooms.clear();
    savePersistedDismissed(dismissedRooms);
    if(lastGood && Array.isArray(lastGood.rooms)){
      render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms);
    }
    return;
  }
  const tabBtn = ev.target.closest(".tabbtn");
  if(tabBtn){
    location.hash = tabBtn.dataset.tab === "inbox" ? "#inbox" : "";
    return;
  }
  const inboxLink = ev.target.closest(".inboxlink");
  if(inboxLink){
    inboxRoomFilter = inboxLink.dataset.room || "";
    location.hash = "#inbox";
    if(window.getSelection) { try { window.getSelection().removeAllRanges(); } catch(e){} }
    if(document.activeElement && typeof document.activeElement.blur === "function") document.activeElement.blur();
  }
});
window.addEventListener("hashchange", applyRoute);

(async () => {
  const mcp = await claude.use("mcp");
  if(!mcp){
    banner("<b>No MCP in this view.</b> The fleet feed comes from the <span class='mono'>baton</span> connector; this surface cannot reach connectors.");
    $("fresh").textContent = "static";
    applyRoute();
    return;
  }
  window.mcpHandle = mcp;
  // #1486: heartbeat_at (independent of the change-gated snapshot) is what tells a dead pusher
  // apart from a quiet fleet whose pushed_at is legitimately stale. Loud only past ~2 missed beats
  // + slop, so one delayed cycle doesn't cry wolf.
  const HEARTBEAT_DEAD_MS = 2.5 * 60 * 60 * 1000;
  // #1613 item 2: the "stuck" check below keys on derived_at (when the pusher's OWN snapshot
  // derivation last actually completed), never on pushed_at -- pushed_at legitimately goes stale
  // on a quiet-but-healthy fleet (the #1457 change-gate skips an unchanged snapshot), which is
  // exactly what made the pre-#1613 pushed_at-keyed version of this banner false-fire constantly.
  // derived_at reaches the mailbox on its own ~5-minute cadence independent of whether anything
  // pushed (pusher.py's DERIVED_PING_INTERVAL_SECONDS), so this threshold stays the same order of
  // magnitude the banner already used, rather than degrading to heartbeat's own coarser cadence.
  const RUNNING_SUSPICION_MS = 10 * 60 * 1000;
  // 2026-09-01 review finding 2: pending_push_age_s (seconds the pusher has had content waiting to
  // go out since its last SUCCESSFUL push, present only while something is actually pending -- see
  // pusher.py's own pending_push_age_s doc) is a DIFFERENT failure than the derivation-stuck check
  // below: derivation can keep succeeding every cycle (derived_at stays fresh) while every PUSH
  // fails (a 413 from the 1 MB cap, a 5xx, a network blip) -- dropping the old pushed_at-keyed
  // banner removed the only signal that used to catch that. Same order of magnitude as
  // RUNNING_SUSPICION_MS: a coalesced-but-healthy pending age never exceeds the 90s floor by more
  // than one polling interval, so only a genuinely failing push keeps growing past minutes.
  const PUSH_FAILING_MS = 10 * 60 * 1000;
  mcp.watchTool("baton", "fleet_status", {}, (ev) => {
    if(ev.type === "data"){
      let snap = ev.result.payload;
      if(typeof snap === "string"){ try { snap = JSON.parse(snap); } catch { snap = null; } }
      if(snap && Array.isArray(snap.rooms)){
        lastGood = snap;
        accumulatedTimelines = updateAccumulatedTimelines(accumulatedTimelines, snap.rooms, snap.timelines);
        savePersistedTimelines(accumulatedTimelines);
        dismissedRooms = pruneDismissed(dismissedRooms, snap.rooms);
        savePersistedDismissed(dismissedRooms);
        // #1656: terminal_total (absent on an unredeployed pusher, same optional-field convention
        // as every other fleet_status extension) tells the Terminal section's "load older" link
        // whether the hot set's newest-N terminal rooms are the whole population or not -- never
        // reset terminalNextPage here, which would throw away pages the operator already loaded on
        // every 30s poll.
        if(typeof snap.terminal_total === "number") terminalTotal = snap.terminal_total;
        const hbMs = snap.heartbeat_at ? Date.now() - Date.parse(snap.heartbeat_at) : null;
        const derivedMs = snap.derived_at ? Date.now() - Date.parse(snap.derived_at) : null;
        const pendingPushMs = typeof snap.pending_push_age_s === "number" ? snap.pending_push_age_s * 1000 : null;
        const running = snap.rooms.some(r => r.state === "Running");
        if(hbMs == null){
          banner("<b>No heartbeat recorded yet.</b> heartbeat_at is unset — redeploy worker.js and the pusher for #1486, or the mailbox hasn't received one yet.");
        } else if(!isFinite(hbMs) || hbMs > HEARTBEAT_DEAD_MS){
          banner(`<b>Pusher likely dead.</b> No heartbeat in ${esc(age(snap.heartbeat_at) || "over 2.5h")} — the fleet machine may be off or the pusher process may have stopped. Data below is from the last push.`);
        } else if(derivedMs == null){
          // Finding 6: mirrors the hbMs==null branch above -- a pusher not yet redeployed for
          // #1613 posts no derived_at at all, and that used to fall through to a silently clean
          // banner, disabling the "derivation may be stuck" check below with no indication why.
          banner("<b>No derivation timestamp yet.</b> derived_at is unset — redeploy pusher.py for #1613, or the mailbox hasn't received one yet.");
        } else if(pendingPushMs != null && isFinite(pendingPushMs) && pendingPushMs > PUSH_FAILING_MS){
          banner(`<b>Push failing.</b> The pusher has had a snapshot waiting to go out for ${esc(dur(pendingPushMs))} even though derivation is healthy (derived_at ${esc(age(snap.derived_at))} ago) — check pusher.log for POST errors (413 from the 1 MB cap, 5xx, network). Data below may be stale.`);
        } else if(running && isFinite(derivedMs) && derivedMs > RUNNING_SUSPICION_MS){
          banner(`<b>Snapshot derivation may be stuck.</b> The pusher is alive (heartbeat ${esc(age(snap.heartbeat_at))} ago) but its last successful derivation was ${esc(age(snap.derived_at))} ago while rooms show Running — derive_snapshot_and_timelines may be failing every cycle.`);
        } else {
          banner("");
        }
        render(snap.rooms, snap.pushed_at, snap.underhood, snap.heartbeat_at, accumulatedTimelines, snap.stale_hidden_count, dismissedRooms, snap.conductor);
      } else if(snap && snap.rooms === null){
        $("content").innerHTML = "";
        $("dismissnote").innerHTML = "";
        banner("<b>No snapshot pushed yet.</b> The mailbox is live but the fleet machine hasn't pushed data.");
        $("fresh").textContent = "empty mailbox";
      }
      return;
    }
    const e = ev.error || {};
    if(e.code === "server_not_connected"){
      if(lastGood){ banner("<b>Feed lost.</b> The baton connector is not reachable — data below is the last snapshot."); }
      else { banner("<b>The baton connector is not connected in this view.</b> Add it once via Settings → Connectors → Add custom (or the connector prompt this page raises), then reload."); $("fresh").textContent = "no feed"; }
    } else if(e.code === "needs_reauth" || e.code === "blocked_by_policy" || e.code === "approval_required"){
      $("content").innerHTML = "";
      banner(`<b>Access denied</b> (${esc(e.code)}). ${esc(e.message || "")}`);
      $("fresh").textContent = "no feed";
    } else if(e.code === "tool_error"){
      banner(`<b>fleet_status reported failure:</b> ${esc(e.message || "")}` + (lastGood ? " — showing last good data." : ""));
    } else {
      if(!lastGood){ banner(`<b>No data yet</b> (${esc(e.code || "unknown")}). ${esc(upstreamErrorDetail(e))}`); }
    }
  }, { refetchInterval: 30000, cache: { staleTime: 25000 } });

  mcp.watchTool("baton", "deliverables_list", {}, (ev) => {
    if(ev.type === "data"){
      let payload = ev.result.payload;
      if(typeof payload === "string"){ try { payload = JSON.parse(payload); } catch { payload = null; } }
      inboxIndex = (payload && Array.isArray(payload.items)) ? payload.items : [];
      if(!location.hash.startsWith("#inbox:")) applyRoute();
      if(lastGood && Array.isArray(lastGood.rooms)){
        render(lastGood.rooms, lastGood.pushed_at, lastGood.underhood, lastGood.heartbeat_at, accumulatedTimelines, lastGood.stale_hidden_count, dismissedRooms, lastGood.conductor);
      }
      return;
    }
    const e = ev.error || {};
    $("inboxbanner").innerHTML = `<div class="banner"><b>Inbox feed unavailable</b> (${esc(e.code || "unknown")}). ${esc(upstreamErrorDetail(e))}</div>`;
  }, { refetchInterval: 30000, cache: { staleTime: 25000 } });

  applyRoute();
})();
</script>

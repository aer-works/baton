name: PR body lint

# The PR-body guard, split out of ci.yml's `audit` job (#862). It lives alone, and on `edited`,
# for one reason: when it reds a faulty body, fixing the body must CLEAR it. Inside `ci.yml` it
# could not -- `on: pull_request` defaults to types [opened, synchronize, reopened], so an edit
# started no run and `gh run rerun` replayed the stale body, leaving the red to survive the fix
# until an unrelated push. Adding `edited` to ci.yml instead was rejected: an edit-only run skips
# the test jobs, and the `ci` aggregate treats a skipped job as fine, so editing a description
# could satisfy the merge gate on a PR whose tests failed. A standalone check has no such blast
# radius -- it runs only this lint, so an edit can green only this lint.
#
# This is a SECOND branch-protection required check alongside `ci`; `ci` still gates the heavy
# jobs. The negated-close LOGIC stays tested by `audit-selfcheck` in ci.yml's audit job (its
# polarity arms run both incident bodies verbatim); only the live PR-body invocation moved here.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  pr-body-lint:
    # release-please's own PRs carry a generated body quoting changelog lines ("...can
    # resolve (#1473)"), which the negated-close rule rightly flags in human-authored text but
    # nobody wrote here, and release-please overwrites any hand edit on its next push. Skip the
    # job for those branches -- a skipped required check still satisfies branch protection (#1475).
    if: ${{ !startsWith(github.event.pull_request.head.ref, 'release-please--branches--') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Declared rather than inherited: the closures step reads issues via the job token, and an org
    # tightening the default token scope later should not silently break it (#975 review).
    permissions:
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@v4
      # No submodule, no .NET, no build: both steps read the PR body as text through
      # completeness.py; the closures step additionally fetches each DECLARED target issue live via
      # `gh`. Same setup the audit job uses -- let `pixi run` do the implicit install.
      - uses: prefix-dev/setup-pixi@v0.8.0
        with:
          run-install: false
          cache: false
      # Body only. A commit message with the same shape is a separate defect this cannot reach:
      # the merge squashes them, and the body is what GitHub actually reads.
      - name: A negated closing keyword still closes the issue
        env:
          BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$BODY" | pixi run audit-completeness -- --pr-body
      # #975: a declared close must not strand unchecked scope boxes outside the open backlog.
      # The issue body is fetched at RUN time, so fixing the issue needs only a re-run of this
      # check, not a PR edit (unlike the body lint above, whose `edited` trigger exists because a
      # rerun replays the stale body -- the asymmetry is deliberate and correct for each input).
      # `always()` so a keyword fault in the step above does not hide a partial-close fault here —
      # both are body defects and the author should learn of both in one run, not two round-trips.
      - name: A declared close leaves no unchecked scope boxes behind
        if: always()
        env:
          BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
        run: printf '%s' "$BODY" | pixi run audit-completeness -- --pr-closures

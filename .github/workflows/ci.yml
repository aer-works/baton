name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Detects which areas a PR touched, so the heavy jobs below can skip when irrelevant.
  # pull_request ONLY: paths-filter uses the API there (no checkout needed), but on push it shells
  # out to `git` and dies without a checkout (#410). On push the heavy jobs ignore this job entirely
  # -- their `!cancelled()` if: runs them unconditionally, so main is always validated in full. (A
  # skipped `needs` dependency would normally skip its dependents; those jobs' if: uses a status
  # function to opt out of that -- see their comments.)
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'src/**'
              - 'tests/**'
              - 'Baton.slnx'
              - 'Directory.Build.props'
              - 'coverage.runsettings'
              - 'pixi.toml'
              - 'pixi.lock'
              - '**/packages.lock.json'
              - '.github/workflows/**'

  test:
    needs: changes
    # PR: run only when .NET-relevant files changed. Push to main: always run (main stays green).
    # !cancelled() makes this a status-check expression, so a skipped `changes` (PR-only, #410)
    # does not skip this job on push.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true') }}
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # Windows-only (#1405): one matrix, both events.
        #
        # Sharding the long-pole Windows test leg (#1363): Flow suite vs remaining
        # test projects cuts test duration from ~3:49 to ~1:55.
        include:
          - { os: "windows-latest", name: "windows-shard-flow", task: "test-flow" }
          - { os: "windows-latest", name: "windows-shard-other", task: "test-other" }
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - uses: actions/checkout@v4

      # run-install/cache are off: the pixi env is deliberately empty (the .NET SDK is a system
      # install, not a conda package — GitHub's standard runner images ship it already), and
      # setup-pixi's `pixi list` step fails hard on an empty environment. `pixi run` performs the
      # (trivial) implicit install on first use instead.
      # #1117: the pixi binary download itself flaked ("socket hang up") four times on
      # 2026-08-12, failing runs before any repo code executed. One bounded retry; a second
      # failure still fails the job, so required-job semantics are unchanged. The failed
      # attempt's post step is harmless: it only looks for the binary the successful attempt
      # installed at the same path.
      - uses: prefix-dev/setup-pixi@v0.8.0
        id: pixi-attempt-1
        continue-on-error: true
        with:
          run-install: false
          cache: false
      # 30s backoff before the retry: the first live firing (run 31640170988, ubuntu) lost
      # both attempts to a CDN 503 seconds apart — a pause is what gives attempt 2 a chance
      # a back-to-back retry measurably did not have.
      - if: steps.pixi-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30
      - uses: prefix-dev/setup-pixi@v0.8.0
        if: steps.pixi-attempt-1.outcome == 'failure'
        with:
          run-install: false
          cache: false

      # Caches NuGet restore keyed off every packages.lock.json in the repo (the xunit test
      # projects — Baton.Tests, Baton.Vendors.Tests — are the only ones with real
      # PackageReferences). cache-dependency-path must be explicit: cache: true alone only looks
      # for a lock file at the repo root, not recursively.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"



      # Isolation guard (#318). The suite redirects BATON_HOME to a throwaway temp root
      # (tests/Shared/BatonHomeRedirect.cs), so a correct run never touches the real ~/.baton. Snapshot
      # it before and after the run and fail if anything changed: this is what catches a store added
      # later that bypasses BatonPaths and writes to the real per-user dir -- the day it lands, not six
      # milestones on when a user finds 48 dead projects. Path list only (not mtimes), so a benign
      # touch of a pre-existing file doesn't false-positive.
      - name: Snapshot ~/.baton before tests
        shell: bash
        run: |
          if [ -d "$HOME/.baton" ]; then
            find "$HOME/.baton" -type f | LC_ALL=C sort > "$RUNNER_TEMP/aer-before.txt"
          else
            : > "$RUNNER_TEMP/aer-before.txt"
          fi

      - name: Test
        run: pixi run ${{ matrix.task }}

      # Diagnostic for the #398 file-lock flake class. On a Windows test failure, capture whether
      # Defender real-time protection is actually on (PR #922 measured that windows-latest excludes
      # C:\ and D:\ whole-drive, so realtime is almost certainly irrelevant to these files — this
      # confirms it) plus a snapshot of the scan-capable services. The transient handle itself is
      # already gone by the time this post-hoc step runs, which is exactly why the in-process holder
      # name now rides in FlowJournalHeldException's message (src/Baton/Store/FileHolderProbe.cs);
      # this step is the environmental context around that. Never fails the job.
      - name: Capture file-lock diagnostics on failure (Windows)
        if: ${{ failure() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          try {
            Get-MpComputerStatus |
              Select-Object RealTimeProtectionEnabled, AntivirusEnabled, IsTamperProtected, AMRunningMode |
              Format-List
          } catch { Write-Warning "Get-MpComputerStatus unavailable: $($_.Exception.Message)" }
          try {
            Get-Service -Name WSearch, WinDefend -ErrorAction SilentlyContinue |
              Select-Object Name, Status | Format-Table -AutoSize
          } catch { Write-Warning "Get-Service unavailable: $($_.Exception.Message)" }

      - name: Assert ~/.baton untouched by tests
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/aer-before.txt" ]; then
            echo "Pre-test snapshot missing (an earlier step failed before tests ran); nothing to check."
            exit 0
          fi
          if [ -d "$HOME/.baton" ]; then
            find "$HOME/.baton" -type f | LC_ALL=C sort > "$RUNNER_TEMP/aer-after.txt"
          else
            : > "$RUNNER_TEMP/aer-after.txt"
          fi
          if ! diff -u "$RUNNER_TEMP/aer-before.txt" "$RUNNER_TEMP/aer-after.txt"; then
            echo "::error::Tests changed the real ~/.baton. The BATON_HOME redirect leaked -- a store is bypassing BatonPaths (see tests/Shared/BatonHomeRedirect.cs and src/Baton.Vendors/BatonPaths.cs)."
            exit 1
          fi
          echo "~/.baton unchanged by the test run."

      - name: Shutdown dotnet build server
        run: pixi run dotnet build-server shutdown
        if: always()

  # Platform-independent formatting and compiler/linter checks hoisted out of the test matrix (#1363).
  # Runs parallel to the test legs, saving ~2 min of serial overhead off the long pole. Windows-only
  # (#1405): no non-Windows-specific step here, so this just moved to the same runner as everything else.
  lint:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true') }}
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.0
        id: pixi-attempt-1
        continue-on-error: true
        with:
          run-install: false
          cache: false
      - if: steps.pixi-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30
      - uses: prefix-dev/setup-pixi@v0.8.0
        if: steps.pixi-attempt-1.outcome == 'failure'
        with:
          run-install: false
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Check formatting
        run: pixi run fmt-check

      - name: Lint
        run: pixi run lint

      - name: Shutdown dotnet build server
        run: pixi run dotnet build-server shutdown
        if: always()

  # M13 Phase 3 (#109): packs baton into a nupkg — Windows-only (#1405), so this is a single-RID
  # (win-x64) package, not a multi-RID one (see the `Pack baton` step below for what that packs
  # post-#1474). Runs after `test`
  # so it only packs a library that already passed lint and test.
  # Pushes to main only: it verifies packaging integrity, not the correctness of the change under
  # review, so main is the right place for it.
  pack:
    # !cancelled() opts this out of the changes-skip propagation on push (#412; the changes job is
    # PR-only per #410, and its skip otherwise cascades through `test` to here). The explicit
    # needs.test.result check restores the "only pack a green build" guarantee that the implicit
    # needs-success gate provided before !cancelled() removed it.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test.result == 'success' }}
    needs: test
    runs-on: windows-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - uses: actions/checkout@v4

      # #1117: the pixi binary download itself flaked ("socket hang up") four times on
      # 2026-08-12, failing runs before any repo code executed. One bounded retry; a second
      # failure still fails the job, so required-job semantics are unchanged. The failed
      # attempt's post step is harmless: it only looks for the binary the successful attempt
      # installed at the same path.
      - uses: prefix-dev/setup-pixi@v0.8.0
        id: pixi-attempt-1
        continue-on-error: true
        with:
          run-install: false
          cache: false
      # 30s backoff before the retry: the first live firing (run 31640170988, ubuntu) lost
      # both attempts to a CDN 503 seconds apart — a pause is what gives attempt 2 a chance
      # a back-to-back retry measurably did not have.
      - if: steps.pixi-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30
      - uses: prefix-dev/setup-pixi@v0.8.0
        if: steps.pixi-attempt-1.outcome == 'failure'
        with:
          run-install: false
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # Pure managed code since #1474 — no native library to build or embed, so nothing to fetch
      # from another leg's artifact.
      - name: Pack baton
        run: pixi run pack

      - name: Upload packed nupkg
        uses: actions/upload-artifact@v4
        with:
          name: aer-nupkg
          path: bin/pack/*.nupkg

      # M13 Phase 4 (#110), the milestone's completion gate: unattended, since (unlike
      # smoke-claude/smoke-mixed-vendor) it needs no live vendor auth -- install → run against a
      # locally-stubbed claude binary → assert the declared output landed on disk → uninstall.
      - name: Verify installed-tool round trip
        run: pixi run verify-pack

  # The single branch-protection required status check. Aggregates the path-filtered heavy jobs into
  # one always-reporting context, so filtering can skip a leg on a PR without leaving a required
  # check stuck at "Expected" forever. Passes when nothing that ran FAILED -- a path-skipped job
  # counts as fine; only a real failure or cancellation fails the gate. `pack` is deliberately not
  # aggregated here: it is a main-only, post-merge packaging check, not part of PR mergeability.
  # The register meta-check (#589, #620). Deliberately its own job rather than a step in `test`:
  # it is OS-independent, so running it on all three matrix legs would triple the cost for one
  # answer, and it must run even when a PR touches no .NET file at all -- a decisions-only or
  # docs-only change is exactly the kind this catches.
  #
  # It is wired in only now that it exits 0. It had been failing for days while nobody noticed,
  # because it ran when someone remembered and was then read by eye: its failure prefix is `!!`,
  # a session filtered the output for `OK`/`FAIL`, and the red run was reported as passing 16/16
  # in a merged PR body. Adding a red check to CI would have blocked every unrelated PR on
  # pre-existing debt, which is why #589 landed first.
  audit:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The record-once check below diffs against origin/main. A shallow clone cannot see it, and
          # the check fails closed rather than passing on an unreadable diff -- so the depth is what
          # makes it run at all.
          fetch-depth: 0
      # Same setup the test and pack jobs use, for the reason recorded there: pinning a pixi version
      # pinned one too old to read this repo's lock file (version 7), and setup-pixi's own install
      # step fails hard on an empty environment. Let `pixi run` do the implicit install.
      # #1117: the pixi binary download itself flaked ("socket hang up") four times on
      # 2026-08-12, failing runs before any repo code executed. One bounded retry; a second
      # failure still fails the job, so required-job semantics are unchanged. The failed
      # attempt's post step is harmless: it only looks for the binary the successful attempt
      # installed at the same path.
      - uses: prefix-dev/setup-pixi@v0.8.0
        id: pixi-attempt-1
        continue-on-error: true
        with:
          run-install: false
          cache: false
      # 30s backoff before the retry: the first live firing (run 31640170988, ubuntu) lost
      # both attempts to a CDN 503 seconds apart — a pause is what gives attempt 2 a chance
      # a back-to-back retry measurably did not have.
      - if: steps.pixi-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30
      - uses: prefix-dev/setup-pixi@v0.8.0
        if: steps.pixi-attempt-1.outcome == 'failure'
        with:
          run-install: false
          cache: false
      # No submodule, no .NET, no build: this reads docs/, decisions/ and the vendor-verify
      # registry as text. The exit code is the verdict -- never the output.
      - name: Audit register completeness
        run: pixi run audit-completeness
      # audit-selfcheck below is no longer .NET-free: since #887 the role catalog's one source
      # is the engine (`baton templates --json`), and selfcheck's catalog checks consume it. This
      # builds ONLY Baton.Cli -- no native lib, no cargo (see pixi.toml's build-cli).
      # cache is OFF here (#1398): Baton.Cli's project graph has zero PackageReferences (framework
      # refs resolve from SDK runtime packs, outside NuGet's restore graph), so restore never
      # creates ~/.nuget/packages -- and then setup-dotnet's post-job cache save fails the job
      # after every audit step passed. A cache saves nothing here; heavy test/pack jobs keep theirs.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          cache: false
      - name: Build the CLI the selfcheck reads the catalog through
        run: pixi run build-cli
      # The checkers' own checker (#630). Same job on purpose: it reads the same registers as
      # text -- plus, since #887, the engine catalog via the CLI built above -- needs no vendor,
      # and a failure has to block the same aggregate `ci` gate.
      - name: Assert the tooling's enumerable surfaces
        run: pixi run audit-selfcheck
      # Proves the step above discriminates, by breaking what each assertion checks and requiring it
      # to go red. Four of those assertions were once satisfied by construction rather than by
      # comparison and printed OK; a reviewer found them by reading, and nothing in the repo could
      # have. Same job because a checker that has stopped checking must block the same gate as a
      # checker that failed.
      - name: Prove those assertions discriminate
        run: pixi run audit-controls
      # See tools/audit-completeness/recordonce.py (#671). The pin that keeps this checker honest on
      # real data runs inside audit-selfcheck above, where audit-controls can reach it.
      - name: No fact is explained in more than one place
        run: pixi run audit-recordonce -- origin/${{ github.base_ref || 'main' }}
      # #1397: the docs-budget tripwire (see docsbudget.py). No build, no vendor -- same job as
      # the other free audits above.
      - name: Tracked markdown stays within the docs budget
        run: pixi run audit-docsbudget
      # #1428: the spec-citation tripwire (see speccitations.py). No build, no vendor -- same job
      # as the other free audits above.
      - name: The spec carries no line-number citations
        run: pixi run audit-speccitations && pixi run audit-speccitations-selftest
      # #1430: the comment spec-ref tripwire (see commentspecrefs.py). No build, no vendor --
      # belongs with the free audits here.
      - name: Every § in a code comment resolves to a live document
        run: pixi run audit-commentspecrefs && pixi run audit-commentspecrefs-selftest
      # Hermetic gate polarity check (#1601, see tools/gates/sabotage.py).
      - name: Prove gate members go red under sabotage
        run: pixi run gate-sabotage
      # The live PR-body guard moved to its own workflow, .github/workflows/pr-body-lint.yml (#862),
      # so that fixing a bad body CLEARS it (it runs on `edited`; this job does not). Its logic is
      # still tested here -- `negated_close_faults`'s polarity arms run in audit-selfcheck above,
      # driven by both incident bodies verbatim -- so nothing about the check's correctness left
      # this job; only the invocation against the live body did.

  ci:
    needs: [changes, test, lint, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "results: changes=$CHANGES test=$TEST lint=$LINT audit=$AUDIT"
          for r in "$CHANGES" "$TEST" "$LINT" "$AUDIT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job reported '$r'."
              exit 1
            fi
          done
          echo "CI gate passed (skipped or successful jobs are OK)."

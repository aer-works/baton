name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Detects which areas a PR touched, so the heavy jobs below can skip when irrelevant (a .NET-only
  # PR shouldn't wait ~9 min for the Android APK, and a Dart-only PR shouldn't run the .NET legs).
  # pull_request ONLY: paths-filter uses the API there (no checkout needed), but on push it shells
  # out to `git` and dies without a checkout (#410). On push the heavy jobs ignore this job entirely
  # -- their `!cancelled()` if: runs them unconditionally, so main is always validated in full. (A
  # skipped `needs` dependency would normally skip its dependents; those jobs' if: uses a status
  # function to opt out of that -- see their comments.)
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      dotnet: ${{ steps.filter.outputs.dotnet }}
      mobile: ${{ steps.filter.outputs.mobile }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            dotnet:
              - 'src/**'
              - '!src/Aer.Mobile/**'
              - 'tests/**'
              - 'external/**'
              - '.gitmodules'
              - 'AerFlow.slnx'
              - 'Directory.Build.props'
              - 'coverage.runsettings'
              - 'pixi.toml'
              - 'pixi.lock'
              - '**/packages.lock.json'
              - '.github/workflows/**'
            # Deliberately NOT '.github/workflows/**': every job shares ci.yml, so that glob ran
            # the 9-minute Android build for a one-line edit to an unrelated job (#677). The mobile
            # steps live in their own file precisely so this filter can name them.
            mobile:
              - 'src/Aer.Mobile/**'
              - '.github/workflows/mobile.yml'

  test:
    needs: changes
    # PR: run only when .NET-relevant files changed. Push to main: always run (main stays green).
    # !cancelled() makes this a status-check expression, so a skipped `changes` (PR-only, #410)
    # does not skip this job on push.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true') }}
    name: test (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        # macos-latest exists so pixi.toml's declared osx-arm64 support actually builds somewhere —
        # cross-compiling aer_core to aarch64-apple-darwin from the ubuntu-latest runner isn't
        # practical without Apple's SDK. rid/lib-name key each OS's native-lib artifact for the pack
        # job below to gather.
        #
        # It runs only on pushes to main, never on pull requests. Measured on a real run it takes 3
        # of the workflow's 19 wall-clock minutes but 30 of its 51 billable ones, because macOS
        # runners bill at a 10x multiplier — 59% of the cost for 6% of the time. Reserving it for
        # main keeps PR feedback fast and still catches macOS breakage before it can compound, and
        # keeps the workflow affordable should this repository ever go private (the Free tier's
        # 2,000 minutes/month is under one backlog sweep at the unreserved rate). The pack job below
        # is gated identically because it cannot assemble a multi-RID package without this leg's
        # artifact.
        #
        # These leg names are NO LONGER branch-protection required contexts on their own -- the
        # single `ci` gate job at the bottom of this file is (it aggregates these legs + `mobile`).
        # That indirection is deliberate: the heavy jobs are path-filtered, so a leg that
        # legitimately skips on a given PR would, if it were still a required context, sit at
        # "Expected" forever and block the PR -- exactly what happened when the macOS leg moved to
        # main-only while still listed as required (an unexplained CI hang, not an obvious
        # misconfiguration). Rule: require only the always-running `ci` gate; never list a
        # path-filterable leg as a required context.
        #
        # Sharding the long-pole Windows test leg (#1363): Flow suite vs remaining
        # test projects cuts test duration from ~3:49 to ~1:55.
        include: >-
          ${{ github.event_name == 'push'
              && fromJSON('[{"os":"windows-latest","rid":"win-x64","lib-name":"aer_core.dll","name":"windows-shard-flow","task":"test-flow"},{"os":"windows-latest","rid":"win-x64","lib-name":"aer_core.dll","name":"windows-shard-other","task":"test-other","skip-artifact":true,"go":true},{"os":"ubuntu-latest","rid":"linux-x64","lib-name":"libaer_core.so","name":"ubuntu","task":"test-dotnet"},{"os":"macos-latest","rid":"osx-arm64","lib-name":"libaer_core.dylib","name":"macos","task":"test-dotnet","go":true}]')
              || fromJSON('[{"os":"windows-latest","rid":"win-x64","lib-name":"aer_core.dll","name":"windows-shard-flow","task":"test-flow"},{"os":"windows-latest","rid":"win-x64","lib-name":"aer_core.dll","name":"windows-shard-other","task":"test-other","skip-artifact":true,"go":true},{"os":"ubuntu-latest","rid":"linux-x64","lib-name":"libaer_core.so","name":"ubuntu","task":"test-dotnet"}]') }}
    runs-on: ${{ matrix.os }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      # Caches ~/.cargo and external/aer-core/target, keyed off external/aer-core/Cargo.lock, so
      # `pixi run build-core`'s cargo build only recompiles when the submodule pin actually moves.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: external/aer-core

      # run-install/cache are off: the pixi env is deliberately empty (the .NET SDK and, since M7
      # Phase 6, the Rust toolchain used to build the external/aer-core submodule are both system
      # installs, not conda packages — GitHub's standard runner images ship both already), and
      # setup-pixi's `pixi list` step fails hard on an empty environment. `pixi run` performs the
      # (trivial) implicit install on first use instead.
      # #1117: the pixi binary download itself flaked ("socket hang up") four times on
      # 2026-08-12, failing runs before any repo code executed. One bounded retry; a second
      # failure still fails the job, so required-job semantics are unchanged. The failed
      # attempt's post step is harmless: it only looks for the binary the successful attempt
      # installed at the same path.
      - uses: prefix-dev/setup-pixi@v0.8.0
        id: pixi-attempt-1
        continue-on-error: true
        with:
          run-install: false
          cache: false
      # 30s backoff before the retry: the first live firing (run 31640170988, ubuntu) lost
      # both attempts to a CDN 503 seconds apart — a pause is what gives attempt 2 a chance
      # a back-to-back retry measurably did not have.
      - if: steps.pixi-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30
      - uses: prefix-dev/setup-pixi@v0.8.0
        if: steps.pixi-attempt-1.outcome == 'failure'
        with:
          run-install: false
          cache: false

      # Caches NuGet restore keyed off every packages.lock.json in the repo (the xunit test
      # projects — Aer.Flow.Tests, Aer.Adapters.Tests — are the only ones with real
      # PackageReferences). cache-dependency-path must be explicit: cache: true alone only looks
      # for a lock file at the repo root, not recursively.
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"



      # Isolation guard (#318). The suite redirects AER_HOME to a throwaway temp root
      # (tests/Shared/AerHomeRedirect.cs), so a correct run never touches the real ~/.aer. Snapshot
      # it before and after the run and fail if anything changed: this is what catches a store added
      # later that bypasses AerPaths and writes to the real per-user dir -- the day it lands, not six
      # milestones on when a user finds 48 dead projects. Path list only (not mtimes), so a benign
      # touch of a pre-existing file doesn't false-positive.
      - name: Snapshot ~/.aer before tests
        shell: bash
        run: |
          if [ -d "$HOME/.aer" ]; then
            find "$HOME/.aer" -type f | LC_ALL=C sort > "$RUNNER_TEMP/aer-before.txt"
          else
            : > "$RUNNER_TEMP/aer-before.txt"
          fi

      - name: Test
        run: pixi run ${{ matrix.task }}

      # #1384 review F1: hoisting fmt/lint to the ubuntu lint job also moved the Go sidecar suite
      # off Windows and macOS, but the sidecar's socket/path behavior is platform-divergent — those
      # legs keep their own run. `go: true` marks one leg per non-ubuntu platform (ubuntu's copy
      # lives in the lint job), so same-platform shards don't pay it twice.
      - uses: actions/setup-go@v5
        if: ${{ matrix.go }}
        with:
          go-version: "1.26"
          cache-dependency-path: src/Aer.Sidecar/go.sum

      - name: Sidecar suite (gofmt, vet, tests)
        if: ${{ matrix.go }}
        run: pixi run fmt-check-sidecar && pixi run lint-sidecar && pixi run test-sidecar
        shell: bash

      # Diagnostic for the #398 file-lock flake class. On a Windows test failure, capture whether
      # Defender real-time protection is actually on (PR #922 measured that windows-latest excludes
      # C:\ and D:\ whole-drive, so realtime is almost certainly irrelevant to these files — this
      # confirms it) plus a snapshot of the scan-capable services. The transient handle itself is
      # already gone by the time this post-hoc step runs, which is exactly why the in-process holder
      # name now rides in FlowJournalHeldException's message (src/Aer.Flow/Store/FileHolderProbe.cs);
      # this step is the environmental context around that. Never fails the job.
      - name: Capture file-lock diagnostics on failure (Windows)
        if: ${{ failure() && runner.os == 'Windows' }}
        shell: pwsh
        run: |
          try {
            Get-MpComputerStatus |
              Select-Object RealTimeProtectionEnabled, AntivirusEnabled, IsTamperProtected, AMRunningMode |
              Format-List
          } catch { Write-Warning "Get-MpComputerStatus unavailable: $($_.Exception.Message)" }
          try {
            Get-Service -Name WSearch, WinDefend -ErrorAction SilentlyContinue |
              Select-Object Name, Status | Format-Table -AutoSize
          } catch { Write-Warning "Get-Service unavailable: $($_.Exception.Message)" }

      # The journey reconcile gate (#313, #489). Aer.Journeys.Tests lives OUTSIDE AerFlow.slnx on
      # purpose -- the journey tests themselves are red-specs that fail until a promise is kept, so
      # `pixi run test` must not build them. But the reconcile half is designed to pass: it asserts
      # spec/journeys.md and the code-side Journeys registry never drift (same id set, same titles,
      # byte-identical Status lines). Living outside the solution meant it ran nowhere, while
      # spec/journeys.md claimed "status is machine-kept ... enforced by CI ... this is the teeth".
      # It was not. J6's test passed for a day while both the spec and the registry declared it
      # Fails/DrivenRed, and nothing noticed. This step is the teeth.
      - name: Journey reconcile gate
        run: pixi run journey-reconcile

      - name: Assert ~/.aer untouched by tests
        if: always()
        shell: bash
        run: |
          if [ ! -f "$RUNNER_TEMP/aer-before.txt" ]; then
            echo "Pre-test snapshot missing (an earlier step failed before tests ran); nothing to check."
            exit 0
          fi
          if [ -d "$HOME/.aer" ]; then
            find "$HOME/.aer" -type f | LC_ALL=C sort > "$RUNNER_TEMP/aer-after.txt"
          else
            : > "$RUNNER_TEMP/aer-after.txt"
          fi
          if ! diff -u "$RUNNER_TEMP/aer-before.txt" "$RUNNER_TEMP/aer-after.txt"; then
            echo "::error::Tests changed the real ~/.aer. The AER_HOME redirect leaked -- a store is bypassing AerPaths (see tests/Shared/AerHomeRedirect.cs and src/Aer.Adapters/AerPaths.cs)."
            exit 1
          fi
          echo "~/.aer unchanged by the test run."

      - name: Shutdown dotnet build server
        run: pixi run dotnet build-server shutdown
        if: always()

      # M13 Phase 3 (#109): each OS's own cargo build output (already produced above as a
      # dependency of lint/test) becomes this platform's contribution to the fat multi-RID
      # package the pack job below assembles. Shard 2 on Windows skips upload to avoid duplicate
      # artifact conflicts.
      - name: Upload native library artifact
        if: ${{ !matrix.skip-artifact }}
        uses: actions/upload-artifact@v4
        with:
          name: native-lib-${{ matrix.rid }}
          path: external/aer-core/target/debug/${{ matrix.lib-name }}
          if-no-files-found: error

  # Platform-independent formatting and compiler/linter checks hoisted out of the test matrix (#1363).
  # Runs on ubuntu-latest parallel to the test legs, saving ~2 min of serial overhead off the long pole.
  lint:
    needs: changes
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.dotnet == 'true') }}
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: external/aer-core

      - uses: prefix-dev/setup-pixi@v0.8.0
        id: pixi-attempt-1
        continue-on-error: true
        with:
          run-install: false
          cache: false
      - if: steps.pixi-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30
      - uses: prefix-dev/setup-pixi@v0.8.0
        if: steps.pixi-attempt-1.outcome == 'failure'
        with:
          run-install: false
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: src/Aer.Sidecar/go.sum

      - name: Check formatting
        run: pixi run fmt-check

      - name: Lint
        run: pixi run lint

      - name: Test sidecar
        run: pixi run test-sidecar

      - name: Shutdown dotnet build server
        run: pixi run dotnet build-server shutdown
        if: always()

  # M21 Phase 2 (#232): Aer.Mobile is a separate Dart/Flutter toolchain with no dependency on
  # aer_core or the .NET solution, so it gets its own job rather than joining the matrix above.
  # ubuntu-latest's GitHub-hosted image ships the Android SDK already, so `flutter build apk
  # --debug` catches Android toolchain breaks in CI even though the dev machine that wrote this
  # doesn't have the Android SDK installed locally (see docs/runbooks, or #232's own discussion).
  mobile:
    needs: changes
    # PR: run only when mobile files changed. Push to main: always run (main stays green).
    # !cancelled() makes this a status-check expression, so a skipped `changes` (PR-only, #410)
    # does not skip this job on push.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.mobile == 'true') }}
    uses: ./.github/workflows/mobile.yml

  # M13 Phase 3 (#109): gathers the native libs the test matrix above built on all three OSes into
  # one fat nupkg — the same install command (`dotnet tool install --global aer`) then works
  # regardless of host OS. Runs after `test` so it only packs libraries that already passed lint
  # and test on their own platform.
  # Pushes to main only, matching the macOS matrix leg above: this job downloads that leg's
  # native-lib-osx-arm64 artifact, so on a pull request (where macOS does not run) it would fail
  # at the download step rather than merely pack less. It verifies packaging integrity, not the
  # correctness of the change under review, so main is the right place for it.
  pack:
    # !cancelled() opts this out of the changes-skip propagation on push (#412; the changes job is
    # PR-only per #410, and its skip otherwise cascades through `test` to here). The explicit
    # needs.test.result check restores the "only pack a green build" guarantee that the implicit
    # needs-success gate provided before !cancelled() removed it.
    if: ${{ !cancelled() && github.event_name == 'push' && needs.test.result == 'success' }}
    needs: test
    runs-on: ubuntu-latest
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: external/aer-core

      # #1117: the pixi binary download itself flaked ("socket hang up") four times on
      # 2026-08-12, failing runs before any repo code executed. One bounded retry; a second
      # failure still fails the job, so required-job semantics are unchanged. The failed
      # attempt's post step is harmless: it only looks for the binary the successful attempt
      # installed at the same path.
      - uses: prefix-dev/setup-pixi@v0.8.0
        id: pixi-attempt-1
        continue-on-error: true
        with:
          run-install: false
          cache: false
      # 30s backoff before the retry: the first live firing (run 31640170988, ubuntu) lost
      # both attempts to a CDN 503 seconds apart — a pause is what gives attempt 2 a chance
      # a back-to-back retry measurably did not have.
      - if: steps.pixi-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30
      - uses: prefix-dev/setup-pixi@v0.8.0
        if: steps.pixi-attempt-1.outcome == 'failure'
        with:
          run-install: false
          cache: false

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # This job's own host (Linux) is folded in automatically by `pixi run pack`'s build-core
      # dependency + Aer.Core.csproj's existing build-time copy (M7 Phase 6) — only the other two
      # platforms' pre-built binaries need fetching into the artifacts/native-libs/<rid>/
      # convention Aer.Cli.csproj's Phase 3 items read from.
      - name: Download Windows native library
        uses: actions/download-artifact@v4
        with:
          name: native-lib-win-x64
          path: artifacts/native-libs/win-x64

      - name: Download macOS native library
        uses: actions/download-artifact@v4
        with:
          name: native-lib-osx-arm64
          path: artifacts/native-libs/osx-arm64

      - name: Pack aer (multi-RID)
        run: pixi run pack

      - name: Upload packed nupkg
        uses: actions/upload-artifact@v4
        with:
          name: aer-nupkg
          path: bin/pack/*.nupkg

      # M13 Phase 4 (#110), the milestone's completion gate: unattended, since (unlike
      # smoke-claude/smoke-mixed-vendor) it needs no live vendor auth -- install → run against a
      # locally-stubbed claude binary → assert the declared output landed on disk → uninstall.
      - name: Verify installed-tool round trip
        run: pixi run verify-pack

  # The single branch-protection required status check. Aggregates the path-filtered heavy jobs into
  # one always-reporting context, so filtering can skip a leg on a PR without leaving a required
  # check stuck at "Expected" forever. Passes when nothing that ran FAILED -- a path-skipped job
  # counts as fine; only a real failure or cancellation fails the gate. `pack` is deliberately not
  # aggregated here: it is a main-only, post-merge packaging check, not part of PR mergeability.
  # The register meta-check (#589, #620). Deliberately its own job rather than a step in `test`:
  # it is OS-independent, so running it on all three matrix legs would triple the cost for one
  # answer, and it must run even when a PR touches no .NET file at all -- a decisions-only or
  # docs-only change is exactly the kind this catches.
  #
  # It is wired in only now that it exits 0. It had been failing for days while nobody noticed,
  # because it ran when someone remembered and was then read by eye: its failure prefix is `!!`,
  # a session filtered the output for `OK`/`FAIL`, and the red run was reported as passing 16/16
  # in a merged PR body. Adding a red check to CI would have blocked every unrelated PR on
  # pre-existing debt, which is why #589 landed first.
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The record-once check below diffs against origin/main. A shallow clone cannot see it, and
          # the check fails closed rather than passing on an unreadable diff -- so the depth is what
          # makes it run at all.
          fetch-depth: 0
          # For build-cli below -- pixi.toml's build-cli comment says why the submodule (source
          # only, no cargo) is needed while the native lib is not.
          submodules: true
      # Same setup the test and pack jobs use, for the reason recorded there: pinning a pixi version
      # pinned one too old to read this repo's lock file (version 7), and setup-pixi's own install
      # step fails hard on an empty environment. Let `pixi run` do the implicit install.
      # #1117: the pixi binary download itself flaked ("socket hang up") four times on
      # 2026-08-12, failing runs before any repo code executed. One bounded retry; a second
      # failure still fails the job, so required-job semantics are unchanged. The failed
      # attempt's post step is harmless: it only looks for the binary the successful attempt
      # installed at the same path.
      - uses: prefix-dev/setup-pixi@v0.8.0
        id: pixi-attempt-1
        continue-on-error: true
        with:
          run-install: false
          cache: false
      # 30s backoff before the retry: the first live firing (run 31640170988, ubuntu) lost
      # both attempts to a CDN 503 seconds apart — a pause is what gives attempt 2 a chance
      # a back-to-back retry measurably did not have.
      - if: steps.pixi-attempt-1.outcome == 'failure'
        shell: bash
        run: sleep 30
      - uses: prefix-dev/setup-pixi@v0.8.0
        if: steps.pixi-attempt-1.outcome == 'failure'
        with:
          run-install: false
          cache: false
      # No submodule, no .NET, no build: this reads docs/, decisions/ and the vendor-verify
      # registry as text. The exit code is the verdict -- never the output.
      - name: Audit register completeness
        run: pixi run audit-completeness
      - name: Audit permission rank equality
        run: pixi run audit-permissionrank
      # audit-selfcheck below is no longer .NET-free: since #887 the role catalog's one source
      # is the engine (`aer templates --json`), and selfcheck's catalog checks consume it. This
      # builds ONLY Aer.Cli -- no native lib, no sidecar, no cargo (see pixi.toml's build-cli).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"
      - name: Build the CLI the selfcheck reads the catalog through
        run: pixi run build-cli
      # The checkers' own checker (#630). Same job on purpose: it reads the same registers as
      # text -- plus, since #887, the engine catalog via the CLI built above -- needs no vendor,
      # and a failure has to block the same aggregate `ci` gate.
      - name: Assert the tooling's enumerable surfaces
        run: pixi run audit-selfcheck
      # Proves the step above discriminates, by breaking what each assertion checks and requiring it
      # to go red. Four of those assertions were once satisfied by construction rather than by
      # comparison and printed OK; a reviewer found them by reading, and nothing in the repo could
      # have. Same job because a checker that has stopped checking must block the same gate as a
      # checker that failed.
      - name: Prove those assertions discriminate
        run: pixi run audit-controls
      # See tools/audit-completeness/recordonce.py (#671). The pin that keeps this checker honest on
      # real data runs inside audit-selfcheck above, where audit-controls can reach it.
      - name: No fact is explained in more than one place
        run: pixi run audit-recordonce -- origin/${{ github.base_ref || 'main' }}
      # #1126: this ran only in the pre-push hook's gates-fast — a clone without setup-hooks, a
      # web-UI edit, or any hook-bypassing push reached CI unvocabulary-checked. Same job, same
      # exit-code discipline as the audits above.
      - name: One vocabulary, code and UI alike
        run: pixi run audit-vocabulary
      # #469: the mobile-build WSL guard's decision, driven by fixtures so it runs off a WSL host.
      # No build, no vendor -- reads like the audits above, so it blocks the same aggregate gate.
      - name: mobile-build WSL guard discriminates
        run: pixi run test-scripts
      # The live PR-body guard moved to its own workflow, .github/workflows/pr-body-lint.yml (#862),
      # so that fixing a bad body CLEARS it (it runs on `edited`; this job does not). Its logic is
      # still tested here -- `negated_close_faults`'s polarity arms run in audit-selfcheck above,
      # driven by both incident bodies verbatim -- so nothing about the check's correctness left
      # this job; only the invocation against the live body did.

  ci:
    needs: [changes, test, lint, mobile, audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify no required job failed
        env:
          CHANGES: ${{ needs.changes.result }}
          TEST: ${{ needs.test.result }}
          LINT: ${{ needs.lint.result }}
          MOBILE: ${{ needs.mobile.result }}
          AUDIT: ${{ needs.audit.result }}
        run: |
          echo "results: changes=$CHANGES test=$TEST lint=$LINT mobile=$MOBILE audit=$AUDIT"
          for r in "$CHANGES" "$TEST" "$LINT" "$MOBILE" "$AUDIT"; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              echo "::error::A required CI job reported '$r'."
              exit 1
            fi
          done
          echo "CI gate passed (skipped or successful jobs are OK)."

name: Mobile

# Called by ci.yml's `mobile` job. It lives in its own file so the path filter that decides whether
# to run it can be exact: a filter matches files, and every job used to share ci.yml, so editing any
# job at all triggered this one -- a one-line change to the audit job's `run:` bought a full Android
# build (#677). The filter names this file, so editing these steps still triggers it.
on:
  workflow_call:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # M21 Phase 7 (#246): the `tailscale` package's native-asset build hook cross-compiles a Go
      # shared library (for `flutter build apk`'s Android NDK step, and again for `flutter test`'s
      # host-platform stub) and requires Go 1.26+ itself -- ubuntu-latest's preinstalled toolchain
      # is older, same reasoning as ci.yml's `test` job.
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # #1121: `flutter build apk` invokes the gradle WRAPPER, whose first act on a cold runner is
      # downloading a full gradle distribution — and that download died mid-stream on main
      # (run 31643627243, java.net.SocketException before any compilation), the same
      # toolchain-download disease #1117's pixi retry fixed. A cache keyed off the wrapper's own
      # pinned version makes the download a cache-miss-only event instead of a per-run network bet.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/wrapper
            ~/.gradle/caches
          key: gradle-${{ runner.os }}-${{ hashFiles('src/Aer.Mobile/android/gradle/wrapper/gradle-wrapper.properties', 'src/Aer.Mobile/android/**/*.gradle*') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: flutter pub get
        working-directory: src/Aer.Mobile

      - name: Analyze
        run: flutter analyze
        working-directory: src/Aer.Mobile

      # Excludes the `journey` tag: journey tests (#313) are red-specs run on demand via
      # `pixi run journey-mobile`, not in default CI. See dart_test.yaml.
      - name: Test
        run: flutter test --exclude-tags journey
        working-directory: src/Aer.Mobile

      # 411 of this job's 537 seconds when it was measured for #677. Kept on pull requests
      # deliberately: it is the only leg that exercises the Android NDK and the native-asset build
      # hook, which `analyze` and `test` cannot reach.
      - name: Build debug APK
        run: flutter build apk --debug
        working-directory: src/Aer.Mobile
